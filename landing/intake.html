// ── Submit to Supabase ───────────────────────────────────────────────────────
function buildPayload(){
  const getA = id => S.answers[id];
  const VALID_SERVICES = new Set(['Local move (same city)','Long distance','Just a few items','Loading / unloading help only','Moving in or out of storage','Rearranging within same address']);
  const VALID_SIZES    = new Set(['Single item','Just a few items','Small move','Studio','1 BR','2 BR','3 BR','4+ BR / full house']);
  const VALID_STAIRS   = new Set(['Ground floor','Stairs','Elevator','Both','Ground floor — easy in/out','Stairs only','Both stairs and elevator']);
  const VALID_PARKING  = new Set(['Driveway / right at the door','Street parking — short walk','Long walk (100+ ft)','Loading dock / bay','Permit might be needed','Not sure — call me']);
  const VALID_SPECIAL  = new Set(['Piano','Safe / gun safe','Pool table','Treadmill / Peloton','Big TV (65"+)','Artwork / mirror','Aquarium','Nope — just regular stuff','Not sure']);
  const VALID_COMMON   = new Set(['Couch / sofa','Bed','Dining set','Dresser','Refrigerator','Washer / dryer','Wardrobe / armoire','Bookshelf']);
  const VALID_COMMON_ATTRS = new Set(['Heavy (250lb+)','Needs disassembly','Needs wrapping','Upstairs']);
  const VALID_BOXED    = new Set(['Yes — all boxed','Yes — all boxed and labeled',"Some are, some aren't",'Not yet']);
  const VALID_PREP     = new Set(['Wrap / pad furniture','Disassemble bed frame(s)','Take apart shelving','Unmount TV','Pack the kitchen','None — ready to go']);
  const sanitizeEnum = (val, validSet) => (val && validSet.has(val)) ? val : null;
  const sanitizeMulti = (arr, validSet) => Array.isArray(arr) ? arr.filter(x => validSet.has(x)).slice(0, 20) : [];
  const sanitizeSpecial = (obj, validSet) => {
    if (!obj || typeof obj !== 'object') return [];
    // Flatten to array with repeats: {Piano:2} → ['Piano','Piano']
    const result = [];
    for (const [k, v] of Object.entries(obj)) {
      if (!validSet.has(k)) continue;
      const qty = Math.min(Math.max(1, parseInt(v) || 1), 20);
      for (let i = 0; i < qty; i++) result.push(k);
    }
    return result.slice(0, 50);
  };
  const sanitizeCommonAttrs = (obj, validItems, validAttrs) => {
    if (!obj || typeof obj !== 'object') return null;
    const result = {};
    for (const [k, v] of Object.entries(obj)) {
      if (!validItems.has(k) || !v || typeof v !== 'object') continue;
      const sub = {};
      for (const [a, c] of Object.entries(v)) {
        if (!validAttrs.has(a)) continue;
        const n = Math.min(Math.max(0, parseInt(c) || 0), 50);
        if (n > 0) sub[a] = n;
      }
      if (Object.keys(sub).length) result[k] = sub;
    }
    return Object.keys(result).length ? result : null;
  };

  const contact   = getA('contact') || {};
  const addresses = getA('addresses') || {};
  const stuff     = getA('stuff') || {};
  const access    = getA('access') || {};
  const extras    = getA('extras') || {};
  const photos    = getA('photos') || {};

  return {
    id:                 crypto.randomUUID(),
    name:               clamp(stripHtml(contact.name), 120) || null,
    phone:              clamp(stripHtml(contact.phone), 20)  || null,
    email:              clamp(stripHtml(contact.email), 200) || null,
    service_type:       sanitizeEnum(getA('service'), VALID_SERVICES),
    preferred_date:     clamp(stripHtml(getA('date')?.date), 20) || null,
    preferred_time:     clamp(stripHtml(getA('date')?.time), 20) || null,
    pickup_address:     clamp(stripHtml(addresses.pickup?.addr), 300) || null,
    pickup_place_type:  clamp(stripHtml(addresses.pickup?.place), 60) || null,
    dropoff_address:    clamp(stripHtml(addresses.dropoff?.addr), 300) || null,
    dropoff_place_type: clamp(stripHtml(addresses.dropoff?.place), 60) || null,
    items_size:         sanitizeEnum(stuff.size, VALID_SIZES),
    partial_load:       !!stuff.partial && (stuff.size === 'Studio' || stuff.size === '1 BR'),
    items_list:         clamp(stripHtml(stuff.list), 1000) || null,
    stairs_pickup:      sanitizeEnum(access.stairs_pickup, VALID_STAIRS),
    stairs_dropoff:     sanitizeEnum(access.stairs_dropoff, VALID_STAIRS),
    flights_pickup:     (access.stairs_pickup === 'Stairs' || access.stairs_pickup === 'Both') ? Math.min(Math.max(1, parseInt(access.flights_pickup) || 1), 20) : null,
    flights_dropoff:    (access.stairs_dropoff === 'Stairs' || access.stairs_dropoff === 'Both') ? Math.min(Math.max(1, parseInt(access.flights_dropoff) || 1), 20) : null,
    parking:            sanitizeEnum(access.parking, VALID_PARKING),
    special_items:      sanitizeSpecial(stuff.special, VALID_SPECIAL),
    common_items:       sanitizeSpecial(photos.common, VALID_COMMON),
    common_item_details: sanitizeCommonAttrs(photos.commonAttrs, VALID_COMMON, VALID_COMMON_ATTRS),
    items_boxed:        sanitizeEnum(extras.boxed, VALID_BOXED),
    box_count:          extras.boxed === 'Yes — all boxed' ? Math.min(Math.max(0, parseInt(extras.boxCount) || 0), 200) : null,
    packing_service:    extras.boxed === 'Not yet' ? (extras.packing !== false) : false,
    prep_needed:        sanitizeMulti(extras.prep, VALID_PREP),
    staging:            !!extras.staging,
    other_notes:        clamp(stripHtml(extras.other), 2000) || null,
    photo_urls:         [],
    estimated_price_cents: calcQuote()?.total || null,
    referral_code:      S.referralCode || null,
    sms_consent:        !!contact.smsConsent,
    answers: S.answers,
    notes:   S.notes,
  };
}

// All writes to quote_requests go through a SECURITY DEFINER upsert RPC
// (save_quote_lead). The anon role has no direct SELECT/UPDATE on the table, so
// the public anon key can't be used to dump or tamper with leads; the RPC also
// ignores the payment columns. We keep one stable row id per session so every
// progressive save upserts the same lead. NOTE: the RPC sets all allow-listed
// columns from the payload, so callers must always send the FULL payload (a
// partial payload would null the omitted fields).
// Resolve a referral ?ref= code against the referrer + the customer's contact
// info (eligibility / once-per-person) via the same RPC the server uses, so the
// shown credit always equals what create-quote-payment charges.
async function refreshReferral(){
  if(!S.referralCode) return;
  const c = S.answers['contact'] || {};
  if(!c.email) return; // need contact info to check eligibility
  try {
    const r = await fetch(`${SB_URL}/rest/v1/rpc/referral_lookup`, {
      method:'POST',
      headers:{ 'Authorization':`Bearer ${SB_KEY}`, 'apikey':SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ p_code: S.referralCode, p_email: c.email||'', p_phone: c.phone||'', p_name: c.name||'' }),
    });
    if(!r.ok) return;
    const data = await r.json();
    if(data && data.valid){
      S.referrerName  = data.referrer_name || null;
      S.referralCredit = parseInt(data.credit_cents) || 0;
    } else {
      S.referralCredit = 0;
    }
  } catch(e){ /* non-fatal — credit stays 0, server is authoritative anyway */ }
}

async function saveLead(payload){
  if(!S.quoteRecordId) S.quoteRecordId = payload.id;
  payload.id = S.quoteRecordId;
  return fetch(`${SB_URL}/rest/v1/rpc/save_quote_lead`, {
    method: 'POST',
    headers: { 'Authorization':`Bearer ${SB_KEY}`, 'apikey':SB_KEY, 'Content-Type':'application/json', 'Prefer':'return=minimal' },
    body: JSON.stringify({ p_data: payload }),
    keepalive: true,
  });
}

async function uploadPhotos(recordId) {
  const photoFiles = S.photoFiles['photos'] || [];
  if(!photoFiles.length) return;
  const uploads = photoFiles.slice(0, MAX_FILES_TOTAL).map(async file => {
    const ext = file.name.split('.').pop() || 'jpg';
    const path = `intake/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
    const r = await fetch(`${SB_URL}/storage/v1/object/quote-photos/${path}`, {
      method: 'POST',
      headers: { 'Authorization':`Bearer ${SB_KEY}`, 'apikey':SB_KEY, 'Content-Type': file.type || 'image/jpeg' },
      body: file,
    });
    return r.ok ? `${SB_URL}/storage/v1/object/public/quote-photos/${path}` : null;
  });
  const results = await Promise.allSettled(uploads);
  const photoUrls = results.filter(r => r.status === 'fulfilled' && r.value).map(r => r.value);
  if(photoUrls.length){
    // Re-send the full submitted payload with the resolved photo URLs (the RPC
    // upsert would otherwise null the columns we omit).
    const payload = buildPayload();
    payload.status = 'submitted';
    payload.progress_step = null;
    payload.photo_urls = photoUrls;
    await saveLead(payload);
  }
}

// Best-effort autosave of partial progress so abandoned forms still show up
// as "incomplete" leads with the step the person stopped on. Fires once we have
// contact info (name + phone + email), then again on each step advance.
async function autosaveProgress(){
  const contact = S.answers['contact'] || {};
  if(!contact.name || !contact.phone || !contact.email) return;
  if(S.submitting) return; // don't race the final submit
  const stepTitle = QUESTIONS[S.idx]?.title || '';
  try {
    const payload = buildPayload();
    payload.status = 'incomplete';
    payload.progress_step = stepTitle;
    payload.photo_urls = []; // photos upload only on final submit
    await saveLead(payload);
    maybeSendIntakeAck(); // "we got your request" email + SMS — once the lead exists
  } catch(e){ /* best-effort — never block the user */ }
}

// Fire the "we got your request" confirmation (email + opt-in SMS) once the
// customer has entered their contact info. Guarded client-side so it fires once
// per session; the edge function ALSO dedupes server-side (intake_ack_sent_at),
// so a duplicate call from a fast step-advance is harmless.
async function maybeSendIntakeAck(){
  if(S.ackSent || !S.quoteRecordId) return;
  S.ackSent = true;
  try {
    await fetch(`${SB_URL}/functions/v1/notify-intake-received`, {
      method: 'POST',
      headers: { 'Authorization':`Bearer ${SB_KEY}`, 'apikey':SB_KEY, 'Content-Type':'application/json' },
      body: JSON.stringify({ quote_request_id: S.quoteRecordId }),
      keepalive: true,
    });
  } catch(e){ /* server is authoritative + idempotent — non-fatal */ }
}

async function handleSubmit(){
  if(S.submitting) return;

  // Bot honeypot
  const honeypot = document.getElementById('hp-field');
  if(honeypot && honeypot.value) { showConfirmation(); return; }

  if(!rateLimitOk()){
    alert('Too many submissions. Please call us directly at 512-777-1628.');
    return;
  }

  const btn = document.getElementById('submit-btn');
  if(btn) btn.disabled = true, btn.textContent = 'Saving…';
  S.submitting = true;

  try {
    const payload = buildPayload();
    // Form completed — no longer an abandoned/incomplete lead.
    payload.status = 'submitted';
    payload.progress_step = null;
    // Upsert the lead via the SECURITY DEFINER RPC (works whether this is the
    // first write or a re-submit after going back from payment — same row id).
    const res = await saveLead(payload);
    if(!res.ok) throw new Error(await res.text());

    // Upload photos in background
    uploadPhotos(S.quoteRecordId);

    // Show payment step
    const quote = calcQuote();
    if(quote && quote.deposit >= 50) {
      showPaymentStep(S.quoteRecordId, quote);
    } else {
      showConfirmation();
    }
  } catch(err){
    console.error('Submit error:', err);
    if(btn){ btn.disabled = false; btn.textContent = 'Try again'; }
    S.submitting = false;
    alert('Something went wrong — please call us at 512-777-1628 and we\'ll take it from there.');
  }
}

  stepperEl.style.display = 'none';
  document.querySelector('.pbar-wrap').style.display = 'none';
  // Hide the side nav labels but keep stageEl visible
  stageEl.querySelectorAll('.nav').forEach(n => n.style.display = 'none');

  // Use stackEl as a normal flow container instead of position:relative fixed-height
  stackEl.style.position = 'static';
  stackEl.style.height = 'auto';
  stackEl.style.width = '100%';
  stackEl.style.maxWidth = '480px';
  stackEl.innerHTML = `
    <div style="background:var(--card);border:1.5px solid var(--line2);border-radius:var(--radius);padding:26px 28px;box-shadow:var(--shadow);animation:slideR .32s cubic-bezier(0.16,1,0.3,1)">
      <div class="qnum">Payment</div>
      <div class="qtitle">Secure your booking</div>
      <div class="deposit-summary">
        <div class="ds-row"><span>Estimated total</span><span>${fmtMoney(quote.total)}</span></div>
        ${quote.referralCredit ? `<div class="ds-row" style="color:var(--success);font-weight:700"><span>Referral from ${esc(S.referrerName || 'a friend')}</span><span>-${fmtMoney(quote.referralCredit)}</span></div>` : ''}
        <div class="ds-row total"><span>Due now</span><span>${fmtMoney(quote.finalTotal)}</span></div>
        <div class="ds-note">80% refundable if cancelled 48+ hours before your move; non-refundable within 48 hours.</div>
        <div class="ds-note" style="font-style:italic">* Estimate subject to change based on actual move conditions. Call or text <a href="tel:5127771628" style="color:var(--amber-deep);font-weight:600">512-777-1628</a> if anything about your move changes.</div>
      </div>
      <div id="payment-element"></div>
      <div class="pay-error" id="pay-error"></div>
      <div class="cfoot" style="margin-top:10px">
        <button class="skip-btn" id="pay-back">&larr; back</button>
        <button class="submit-btn" id="pay-btn" disabled>Pay ${fmtMoney(quote.deposit)} &rarr;</button>
      </div>
    </div>`;

  document.getElementById('pay-back').addEventListener('click', () => {
    restorePaymentChrome();
    S.submitting = false;
    showReview();
  });

  if (!stripePromise) {
    console.error('Stripe not loaded');
    const payError = document.getElementById('pay-error');
    payError.textContent = 'Payment form could not load. Tap "Skip" to continue — we\'ll collect payment by phone.';
    payError.style.display = 'block';
    return;
  }

  const payBtn = document.getElementById('pay-btn');
  const payError = document.getElementById('pay-error');

  try {
    // Create PaymentIntent via edge function
    const piRes = await fetch(`${SB_URL}/functions/v1/create-quote-payment`, {
      method: 'POST',
      headers: { 'Content-Type':'application/json', 'Authorization':`Bearer ${SB_KEY}`, 'apikey':SB_KEY },
      body: JSON.stringify({ quote_request_id: recordId }),
    });
    if (!piRes.ok) throw new Error(await piRes.text());
    const { clientSecret, lead_number } = await piRes.json();
    if (lead_number) S.leadNumber = lead_number;

    // Mount Stripe Payment Element
    const elements = stripePromise.elements({
      clientSecret,
      appearance: {
        theme: 'stripe',
        variables: {
          colorPrimary: '#C98B3F',
          colorBackground: '#FFFFFF',
          colorText: '#1A1714',
          colorDanger: '#c0392b',
          fontFamily: 'Inter, system-ui, sans-serif',
          borderRadius: '10px',
        },
      },
    });
    const paymentElement = elements.create('payment');
    paymentElement.mount('#payment-element');

    paymentElement.on('ready', () => { payBtn.disabled = false; });
    paymentElement.on('change', (event) => {
      if (event.complete) {
        payBtn.disabled = false;
        payError.style.display = 'none';
      }
    });

    payBtn.addEventListener('click', async () => {
      payBtn.disabled = true;
      payBtn.textContent = 'Processing…';
      payError.style.display = 'none';

      const { error } = await stripePromise.confirmPayment({
        elements,
        confirmParams: {
          return_url: window.location.href,
        },
        redirect: 'if_required',
      });

      if (error) {
        payError.textContent = error.message;
        payError.style.display = 'block';
        payBtn.disabled = false;
        payBtn.textContent = `Pay ${fmtMoney(quote.deposit)} \u2192`;
      } else {
        // Payment succeeded
        showConfirmation(true);
      }
    });

  } catch(err) {
    console.error('Payment setup error:', err);
    payError.textContent = 'Could not load payment form: ' + (err.message || err) + '. You can skip — we\'ll call you.';
    payError.style.display = 'block';
  }
}

function showConfirmation(paid){
  stageEl.style.display = 'none';
  stepperEl.style.display = 'none';
  document.querySelector('.pbar-wrap').style.display = 'none';
  const mobNav = document.getElementById('mob-nav');
  if (mobNav) mobNav.style.display = 'none';
  backBtn.style.display = 'none';
  nextBtn.style.display = 'none';
  stackEl.innerHTML = '';
  stackEl.style.display = 'none';
  const leadRef = S.leadNumber ? `<div style="margin-top:12px;font-size:14px;color:var(--ink2)">Your reference number: <strong style="color:var(--amber-deep);font-size:18px">#${S.leadNumber}</strong></div>` : '';
  if (paid) {
    confirmEl.querySelector('.confirm-icon').textContent = '✅';
    confirmEl.querySelector('.confirm-title').textContent = 'Booking confirmed!';
    confirmEl.querySelector('.confirm-sub').innerHTML = 'Your payment has been received. We\'ll reach out shortly to finalize the details of your move.' + leadRef;
  } else {
    confirmEl.querySelector('.confirm-sub').innerHTML = 'We received your info and will contact you shortly to get your move set up.' + leadRef;
  }
  confirmEl.classList.add('visible');
}

// ── Keyboard nav ─────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if(e.target.matches('input,textarea,select')) return;
  if(e.key === 'ArrowRight' || e.key === 'Enter') goNext();
  if(e.key === 'ArrowLeft') goBack();
});

nextBtn.addEventListener('click', goNext);
backBtn.addEventListener('click', goBack);

// ── Boot ─────────────────────────────────────────────────────────────────────
// Handle Stripe redirect return (3D Secure etc)
(async function checkStripeReturn() {
  const params = new URLSearchParams(window.location.search);
  const clientSecret = params.get('payment_intent_client_secret');
  if (clientSecret && stripePromise) {
    const { paymentIntent } = await stripePromise.retrievePaymentIntent(clientSecret);
    // 'succeeded' = card / instant. 'processing' = an installment/BNPL method
    // (Affirm, Klarna, Afterpay) was approved and is settling — the webhook
    // finalizes the booking either way, so confirm rather than leave them hanging.
    if (paymentIntent && (paymentIntent.status === 'succeeded' || paymentIntent.status === 'processing')) {
      showConfirmation(true);
      window.history.replaceState({}, '', window.location.pathname);
      return;
    }
  }
})();
// Referral: capture ?ref=CODE from a scanned QR (sanitize to a safe code).
(function captureRef(){
  const raw = new URLSearchParams(window.location.search).get('ref') || '';
  const code = raw.replace(/[^A-Za-z0-9-]/g, '').slice(0, 40);
  if (code) S.referralCode = code;
})();

renderAll();
initMobNav();

// Wire quick photo input — files always go into the dedicated photos question bucket
document.getElementById('photo-quick-input').addEventListener('change', function() {
  const photosQ = QUESTIONS.find(x => x.type === 'photos');
  if (photosQ && this.files.length) {
    handleFiles(photosQ, this.files);
    this.value = ''; // reset so same file can be added again
  }
});

})();
</script>
