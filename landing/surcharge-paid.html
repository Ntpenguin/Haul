<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment received — Fast Fix Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#FAF7F2;--ink:#1A1714;--ink2:#534C44;--ink3:#8B8379;--accent:#C98B3F;--accent-deep:#8B5E2B;--line:#E8E0D4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink2);font-family:Inter,-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;line-height:1.6;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:40px 32px;max-width:440px;text-align:center;box-shadow:0 12px 40px rgba(26,23,20,0.08)}
  .check{width:64px;height:64px;border-radius:50%;background:#e6f6ee;color:#1f7a4d;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px}
  .brand{font-family:'Fraunces',Georgia,serif;color:var(--accent);font-weight:700;font-size:24px;margin-bottom:18px}
  h1{font-family:'Fraunces',Georgia,serif;color:var(--ink);font-size:26px;letter-spacing:-.5px;margin:0 0 10px}
  p{margin:0 0 8px;font-size:15px}
  .muted{color:var(--ink3);font-size:13px;margin-top:18px}
  a.btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:10px}
</style>
</head>
<body>
  <div class="card">
    <div class="brand">Fast Fix Work</div>
    <div class="check">&#10003;</div>
    <h1>Payment received</h1>
    <p>Thanks — your additional charge has been paid in full.</p>
    <p>A receipt has been emailed to you by Stripe.</p>
    <p class="muted">Questions? Call or text 512-777-1628 or email communication@fastfixwork.com</p>
    <a class="btn" href="https://fastfixwork.com/">Back to Fast Fix Work</a>
  </div>
</body>
</html>
