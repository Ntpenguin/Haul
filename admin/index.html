async function createCustomGig() {
  const v = id => (document.getElementById(id) || {}).value;
  const chk = id => !!(document.getElementById(id) || {}).checked;
  const errEl = document.getElementById('ag-err');
  const showErr = m => { if (errEl) { errEl.textContent = m; errEl.style.display = 'block'; } };

  const from = (v('ag-from') || '').trim();
  const to = (v('ag-to') || '').trim();
  if (!from || !to) return showErr('From and To addresses are required.');

  const dollarsIn = parseFloat(v('ag-price'));
  const price_cents = dollarsIn > 0 ? Math.round(dollarsIn * 100) : null;
  const fee = price_cents != null ? Math.round(price_cents * 0.15) : null;
  const payout = price_cents != null ? price_cents - fee : null;
  const status = v('ag-status') || 'posted';
  const isPaid = status === 'in_progress' || status === 'completed';

  const whenRaw = v('ag-when');
  let scheduled_for = null;
  if (whenRaw) { const d = new Date(whenRaw); if (!isNaN(d)) scheduled_for = d.toISOString(); }

  const heavy = (v('ag-heavy') || '').split(',').map(s => s.trim()).filter(Boolean);
  const notesParts = [];
  const cn = (v('ag-cust-name') || '').trim(), cp = (v('ag-cust-phone') || '').trim();
  if (cn || cp) notesParts.push(`Customer: ${cn}${cp ? ' · ' + cp : ''}`);
  if ((v('ag-notes') || '').trim()) notesParts.push(v('ag-notes').trim());

  const gig = {
    customer_id: null,
    status,
    from_address: from,
    to_address: to,
    distance_miles: parseFloat(v('ag-distance')) || null,
    home_size: v('ag-size') || null,
    heavy_items: heavy,
    crew_size: parseInt(v('ag-crew')) || null,
    truck_size: v('ag-truck') || null,
    stairs_from: parseInt(v('ag-stairs-from')) || 0,
    stairs_to: parseInt(v('ag-stairs-to')) || 0,
    elevator_from: chk('ag-elev-from'),
    elevator_to: chk('ag-elev-to'),
    scheduled_for,
    pricing_model: 'flat',
    gig_category: 'moving',
    gig_title: (v('ag-title') || '').trim() || 'Custom gig',
    quoted_price_cents: price_cents,
    platform_fee_cents: fee,
    mover_payout_cents: payout,
    payout_status: 'unpaid',
    paid_at: isPaid ? new Date().toISOString() : null,
    customer_notes: notesParts.join('\n') || null,
  };

  const btn = document.getElementById('ag-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  const { error } = await sb.from('gigs').insert(gig);
  if (error) { if (btn) { btn.disabled = false; btn.textContent = 'Create gig'; } return showErr('Could not create gig: ' + error.message); }
  closeModal();
  await loadAll();
  showPage('gigs');
}

          <div><label style="${lbl}">Years experience</label><input id="am-years" type="number" min="0" style="${fld}"></div>
          <div style="grid-column:1/3"><label style="${lbl}">Skills</label><div style="display:flex;flex-wrap:wrap;gap:6px">${ADD_MOVER_SKILLS.map(([k,l])=>`<label style="display:inline-flex;align-items:center;gap:5px;font-size:13px;padding:4px 9px;border:1px solid var(--line2);border-radius:999px;cursor:pointer"><input type="checkbox" class="am-skill" value="${k}" style="margin:0">${esc(l)}</label>`).join('')}</div></div>
          <div style="grid-column:1/3"><label style="${lbl}">Bio</label><textarea id="am-bio" maxlength="500" style="${fld};min-height:54px"></textarea></div>
          <div style="grid-column:1/3"><label style="${lbl}">Selfie <span style="font-weight:400;text-transform:none">(optional)</span></label><input type="file" id="am-selfie" accept="image/*" style="${fld}" onchange="uploadMoverSelfie(this)"><span id="am-selfie-status" style="font-size:12px;color:var(--ink3)"></span></div>
        </div>
        <div id="am-err" style="color:var(--error);font-size:13px;margin-top:10px;display:none"></div>
        <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px">
          <button onclick="closeModal()" style="padding:9px 16px;background:var(--surface);color:var(--ink2);border:1px solid var(--line2);border-radius:8px;font-size:13px;font-weight:600;cursor:pointer">Cancel</button>

        </div>
      </div>
    </div>`;
}

function genMoverPassword() {
  // CSPRNG-backed: this becomes the worker's real app login password, so don't
  // use Math.random(). Rejection-sample to avoid modulo bias.
  const sets = ['ABCDEFGHJKLMNPQRSTUVWXYZ','abcdefghijkmnpqrstuvwxyz','23456789','!@#$%&*?'];
  const buf = new Uint32Array(1);
  const pick = s => { const max = Math.floor(0xFFFFFFFF / s.length) * s.length;
    do { crypto.getRandomValues(buf); } while (buf[0] >= max); return s[buf[0] % s.length]; };
  const chars = sets.map(pick);                 // guarantee one of each class
  const all = sets.join('');
  while (chars.length < 16) chars.push(pick(all));
  for (let i = chars.length - 1; i > 0; i--) {  // Fisher–Yates shuffle so the
    const max = Math.floor(0xFFFFFFFF / (i + 1)) * (i + 1);   // class chars aren't
    do { crypto.getRandomValues(buf); } while (buf[0] >= max); // pinned to the front
    const j = buf[0] % (i + 1); [chars[i], chars[j]] = [chars[j], chars[i]];
  }
  const input = document.getElementById('am-password');
  if (input) { input.value = chars.join(''); input.type = 'text'; }
}

async function uploadMoverSelfie(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  const status = document.getElementById('am-selfie-status');
  if (!file) return;
  addMoverSelfieUrl = null;
  if (status) status.textContent = 'Uploading…';
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = `mover-selfies/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
  try {
    const r = await fetch(`${SUPABASE_URL}/storage/v1/object/quote-photos/${path}`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'apikey': SUPABASE_ANON_KEY, 'Content-Type': file.type || 'image/jpeg' },
      body: file,
    });
    if (r.ok) { addMoverSelfieUrl = `${SUPABASE_URL}/storage/v1/object/public/quote-photos/${path}`; if (status) status.textContent = 'Selfie uploaded ✓'; }
    else if (status) status.textContent = 'Upload failed';
  } catch (_) { if (status) status.textContent = 'Upload failed'; }
}

async function createMover() {
  const v = id => ((document.getElementById(id) || {}).value || '').trim();
  const errEl = document.getElementById('am-err');
  const showErr = m => { if (errEl) { errEl.textContent = m; errEl.style.display = 'block'; } };
  const isValidPassword = p => p.length >= 8 && /[A-Z]/.test(p) && /[a-z]/.test(p) && /[0-9]/.test(p) && /[^A-Za-z0-9]/.test(p);

  const first = v('am-first'), last = v('am-last'), acct = v('am-acct');
  const phone = v('am-phone'), email = v('am-email'), password = (document.getElementById('am-password') || {}).value || '';
  if (!first || !/^[a-zA-Z\s\-']+$/.test(first)) return showErr('Enter a valid first name.');
  if (!last || !/^[a-zA-Z\s\-']+$/.test(last)) return showErr('Enter a valid last name.');
  if (acct === 'business' && !v('am-bizname')) return showErr('Enter the business name.');
  if (phone.replace(/\D/g,'').length !== 10) return showErr('Enter a valid 10-digit phone number.');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return showErr('Enter a valid email address.');
  if (!isValidPassword(password)) return showErr('Password must be 8+ chars with upper, lower, number, and symbol.');
  const veh = v('am-veh');
  if (veh !== 'muscle' && !v('am-vmm')) return showErr('Enter the vehicle make and model (or pick Muscle-only).');
  const zips = v('am-zips').split(',').map(z => z.trim()).filter(Boolean);
  if (zips.length < 1) return showErr('Enter at least one service ZIP.');
  const skills = [...document.querySelectorAll('.am-skill:checked')].map(c => c.value);

  const btn = document.getElementById('am-save');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating…'; }
  const { data, error } = await sb.functions.invoke('register-mover', { body: {
    first_name: first, last_name: last, phone, email, password,
    account_type: acct, business_name: v('am-bizname'),
    address: v('am-address'), vehicle_type: veh, vehicle_make_model: v('am-vmm'),
    skills, service_zips: zips.join(','), years_experience: v('am-years'),
    bio: v('am-bio'), selfie_url: addMoverSelfieUrl,
  } });
  // Edge-fn errors (409/400/500) come back as a non-2xx → error.context holds the body.
  let errMsg = error ? (error.message || 'Could not create worker') : (data && data.error);
  if (error && error.context && typeof error.context.json === 'function') {
    try { const b = await error.context.json(); if (b && b.error) errMsg = b.error; } catch (_) {}
  }
  if (errMsg) { if (btn) { btn.disabled = false; btn.textContent = 'Create worker'; } return showErr(errMsg); }
  closeModal();
  await loadAll();
  showPage('movers');
}

async function setMoverLevel(id, level) {

// Add a skill to a worker (normalized to lowercase-hyphenated, e.g. "Heavy Lifting" -> "heavy-lifting").
async function addMoverSkill(id) {
  const input = document.getElementById('skill-input-' + id);
  if (!input) return;
  const skill = (input.value || '').trim().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '');
  if (!skill) return;
  const m = cache.moverProfiles.find(x => x.id === id);
  const current = (m && m.skills) || [];
  if (current.includes(skill)) { input.value = ''; return; }
  const next = [...current, skill];
  const { error } = await sb.from('mover_profiles').update({ skills: next }).eq('id', id);
  if (error) { alert('Error adding skill: ' + error.message); return; }
  if (m) m.skills = next;
  showWorkerModal(id);
}

// Remove a skill from a worker.
async function removeMoverSkill(id, skill) {
  const m = cache.moverProfiles.find(x => x.id === id);
  const next = ((m && m.skills) || []).filter(s => s !== skill);
  const { error } = await sb.from('mover_profiles').update({ skills: next }).eq('id', id);
  if (error) { alert('Error removing skill: ' + error.message); return; }
  if (m) m.skills = next;
  showWorkerModal(id);
}

// Delegated handler for skill-chip remove buttons — reads data-* attributes so no
// user-controlled value is ever concatenated into an executable onclick (avoids XSS).
document.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('.skill-remove') : null;
  if (el) removeMoverSkill(el.dataset.id, el.dataset.skill);
});

// Copy-to-clipboard for referral payout contacts (data-* keeps it XSS-safe).
document.addEventListener('click', (e) => {
  const el = e.target.closest ? e.target.closest('.copy-btn') : null;
  if (el && navigator.clipboard) {
    navigator.clipboard.writeText(el.dataset.copy || '');
    const prev = el.textContent;
    el.textContent = 'copied';
    setTimeout(() => { el.textContent = prev; }, 1200);
  }
});

// ─── Leads ───────────────────────────────────
// ── Lead price breakdown (mirrors intake form calcQuote) ─────────────────────
const LEAD_BASE = { 'Single item':9375, 'Just a few items':17500, 'Small move':25000, 'Studio':35000, '1 BR':50000, '2 BR':80000, '3 BR':135000, '4+ BR / full house':160000 };
const LEAD_HEAVY = { 'Piano':25000, 'Safe / gun safe':15000, 'Pool table':30000, 'Treadmill / Peloton':7500, 'Big TV (65"+)':7500, 'Aquarium':7500, 'Artwork / mirror':7500 };
const LEAD_HOURS = { 'Single item':1, 'Just a few items':1.5, 'Small move':1.5, 'Studio':2, '1 BR':3, '2 BR':4, '3 BR':5, '4+ BR / full house':7 };
function estimateLeadHours(l) {
  let hrs = LEAD_HOURS[l.items_size] || 2;
  const sp = l.stairs_pickup || '', sd = l.stairs_dropoff || '';
  if (sp.includes('Stairs')) hrs += 0.5;
  if (sd.includes('Stairs')) hrs += 0.5;
  const special = Array.isArray(l.special_items) ? l.special_items.filter(x => x !== 'Nope — just regular stuff') : [];
  hrs += special.length * 0.25; // repeated entries count individually
  if ((l.parking || '').includes('100+')) hrs += 0.25;
  return Math.ceil(hrs * 2) / 2; // round to nearest 0.5
}
function fmtDuration(hrs) { const h = Math.floor(hrs); const m = (hrs - h) * 60; return m ? `${h}h ${m}m` : `${h}h`; }
function calcLeadQuote(l) {
  const fullBase = LEAD_BASE[l.items_size];
  if (!fullBase) return null;
  // Partial load (Studio / 1 BR only) — 75% of base. Matches intake + create-quote-payment.
  const isPartial = !!l.partial_load && (l.items_size === 'Studio' || l.items_size === '1 BR');
  const base = isPartial ? Math.round(fullBase * 0.75) : fullBase;
  const special = Array.isArray(l.special_items) ? l.special_items.filter(x => x !== 'Nope — just regular stuff') : [];
  const sp = l.stairs_pickup || '', sd = l.stairs_dropoff || '';
  const hasStairs = lbl => lbl === 'Stairs' || lbl === 'Both';
  const hasElevator = lbl => lbl === 'Elevator' || lbl === 'Both';
  const flightsFrom = hasStairs(sp) ? Math.max(1, l.flights_pickup || 1) : 0;
  const flightsTo   = hasStairs(sd) ? Math.max(1, l.flights_dropoff || 1) : 0;
  const flights    = flightsFrom + flightsTo;
  const stairsCents = flights * 5000; // $50/flight — matches intake STAIRS_SURCHARGE
  const elevators   = (hasElevator(sp) ? 1 : 0) + (hasElevator(sd) ? 1 : 0);
  const elevatorCents = elevators * 4000; // $40/location — matches intake ELEVATOR_SURCHARGE
  const carryCents  = (l.parking || '').includes('100+') ? 5000 : 0;
  const heavyCents  = special.reduce((s, x) => s + (LEAD_HEAVY[x] || 7500), 0);
  const isLongDistance = l.service_type === 'Long distance' || l.service_type === 'Long distance (auto)';
  const ldMult = isLongDistance ? 1.5 : 1;
  const adjustedBase = Math.round(base * ldMult);
  const stagingCents = l.staging ? Math.round(adjustedBase * 0.30) : 0;
  const wantsPacking = l.packing_service != null ? l.packing_service : (l.items_boxed === 'Not yet');
  const packingCents = wantsPacking ? Math.round(adjustedBase * 0.35) : 0;
  const PREP_SURCHARGES = { 'Disassemble bed frame(s)': 5000, 'Take apart shelving': 2500 }; // matches intake + create-quote-payment
  const prepItems = (Array.isArray(l.prep_needed) ? l.prep_needed : []).filter(p => PREP_SURCHARGES[p]).map(p => [p, PREP_SURCHARGES[p]]);
  const prepCents = prepItems.reduce((s,[,c]) => s + c, 0);
  const subtotal = adjustedBase + stairsCents + elevatorCents + carryCents + heavyCents + stagingCents + packingCents + prepCents;
  const tax = Math.round(subtotal * 0.0825);
  const total = subtotal + tax;
  const deposit = total; // 100% upfront
  return { base, isPartial, stairsCents, elevatorCents, elevators, carryCents, heavyCents, stagingCents, packingCents, prepItems, isLongDistance, subtotal, tax, total, deposit, flights, heavyCount: special.length };
}
function fmtMoney(c) { return '$' + (c/100).toLocaleString('en-US', {minimumFractionDigits:0,maximumFractionDigits:0}); }
function renderLeadPrice(l) {
  const q = calcLeadQuote(l);
  if (!q) return l.estimated_price_cents
    ? `<div style="background:var(--accent-soft);border:1.5px solid var(--accent);border-radius:10px;padding:12px 14px;margin:10px 0">
        <div style="font-size:11px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px">Submitted estimate</div>
        <div style="font-size:22px;font-weight:800;color:var(--ink)">${fmtMoney(l.estimated_price_cents)}</div>
       </div>` : '';
  const rows = [
    q.isLongDistance ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Long distance (50%)</span><span>+${fmtMoney(Math.round(q.base * 0.5))}</span></div>` : '',
    q.stairsCents ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Stairs (${q.flights} flight${q.flights>1?'s':''})</span><span>+${fmtMoney(q.stairsCents)}</span></div>` : '',
    q.elevatorCents ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Elevator (${q.elevators} location${q.elevators>1?'s':''})</span><span>+${fmtMoney(q.elevatorCents)}</span></div>` : '',
    q.carryCents  ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Long carry</span><span>+${fmtMoney(q.carryCents)}</span></div>` : '',
    q.heavyCents  ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Special items (${q.heavyCount})</span><span>+${fmtMoney(q.heavyCents)}</span></div>` : '',
    q.stagingCents ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Home staging (+30%)</span><span>+${fmtMoney(q.stagingCents)}</span></div>` : '',
    q.packingCents ? `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Packing service (+35%)</span><span>+${fmtMoney(q.packingCents)}</span></div>` : '',
    ...(q.prepItems||[]).map(([label,cents]) => `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>${esc(label)}</span><span>+${fmtMoney(cents)}</span></div>`),
    `<div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Tax (8.25%)</span><span>+${fmtMoney(q.tax)}</span></div>`,
  ].filter(Boolean).join('');
  return `<div style="background:var(--accent-soft);border:2px solid var(--accent);border-radius:12px;padding:14px 16px;margin:10px 0">
    <div style="font-size:11px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Price estimate</div>
    <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);margin-bottom:3px"><span>Base (${l.items_size}${q.isPartial?' · partial −25%':''})</span><span>${fmtMoney(q.base)}</span></div>
    ${rows}
    <div style="border-top:1.5px solid var(--accent);margin:8px 0 6px"></div>
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:16px;font-weight:800;color:var(--ink)">Total</span>
      <span style="font-size:24px;font-weight:800;color:var(--ink)">${fmtMoney(q.total)}</span>
    </div>
    <div style="font-size:12px;color:var(--ink3);margin-top:4px">100% upfront · 80% refundable if cancelled 48+ hrs before move</div>
    <div style="font-size:12px;color:#5E35B1;font-weight:600;margin-top:6px">Est. duration: ${fmtDuration(estimateLeadHours(l))}</div>
  </div>`;
}
function renderLeadPhotos(l) {
  if (!Array.isArray(l.photo_urls) || !l.photo_urls.length) return '';

}

function gcalLink(l) {
  if (!l.preferred_date) return null;
  const d = l.preferred_date.replace(/-/g, '');
  const hrs = estimateLeadHours(l);
  const title = encodeURIComponent(`Move: ${l.name || 'Lead'} (${l.items_size || 'move'}, est. ${fmtDuration(hrs)})`);
  const loc = encodeURIComponent(l.pickup_address || '');
  const details = encodeURIComponent([
    l.phone ? `Phone: ${l.phone}` : '',
    l.email ? `Email: ${l.email}` : '',
    l.service_type ? `Service: ${l.service_type}` : '',
    l.items_size ? `Size: ${l.items_size}` : '',
    `Est. duration: ${fmtDuration(hrs)}`,
    l.dropoff_address ? `Drop-off: ${l.dropoff_address}` : '',
    l.estimated_price_cents ? `Est. price: $${Math.round(l.estimated_price_cents/100).toLocaleString()}` : '',
  ].filter(Boolean).join('\n'));
  // Parse start hour from preferred_time like "9:00 AM"
  let startH = 9;
  if (l.preferred_time) {
    const m = l.preferred_time.match(/(\d+)/);
    if (m) { startH = parseInt(m[1]); if (l.preferred_time.includes('PM') && startH !== 12) startH += 12; }
  }
  const endH = startH + Math.floor(hrs);
  const endM = (hrs % 1) * 60;
  const startTime = String(startH).padStart(2,'0') + '0000';
  const endTime = String(endH).padStart(2,'0') + String(endM).padStart(2,'0') + '00';
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${title}&dates=${d}T${startTime}/${d}T${endTime}&location=${loc}&details=${details}`;
}

// Build a lead's customer/move detail rows. Shared by the lead modal AND the gig
// modal, so a confirmed paid gig shows the same full customer info.
// includeFlow=true adds the lead-flow-only "Stopped on" row (omit it for gigs).
function leadCustomerRows(l, includeFlow) {
  const specialArr = Array.isArray(l.special_items) ? l.special_items.filter(x => x !== 'Nope — just regular stuff') : [];
  const specialCounts = {};
  specialArr.forEach(x => { specialCounts[x] = (specialCounts[x] || 0) + 1; });
  const special = Object.keys(specialCounts).length
    ? Object.entries(specialCounts).map(([k,v]) => v > 1 ? `${k} ×${v}` : k).join(', ') : '—';
  const commonArr = Array.isArray(l.common_items) ? l.common_items : [];
  const commonCounts = {};
  commonArr.forEach(x => { commonCounts[x] = (commonCounts[x] || 0) + 1; });
  const commonDetails = (l.common_item_details && typeof l.common_item_details === 'object') ? l.common_item_details : {};
  const common = Object.keys(commonCounts).length
    ? Object.entries(commonCounts).map(([k,v]) => {
        const label = v > 1 ? `${k} ×${v}` : k;
        const attrs = (commonDetails[k] && typeof commonDetails[k] === 'object') ? commonDetails[k] : null;
        const attrStr = attrs ? Object.entries(attrs).map(([a,c]) => `${c} ${a.toLowerCase()}`).join(', ') : '';
        return attrStr ? `${label} (${attrStr})` : label;
      }).join(', ') : '—';
  const hrs = estimateLeadHours(l);
  const endTimeLabel = l.preferred_time ? (() => {
    const m = l.preferred_time.match(/(\d+)/);
    if (!m) return '';
    let startH = parseInt(m[1]); const isPM = l.preferred_time.includes('PM');
    if (isPM && startH !== 12) startH += 12;
    const endH = startH + Math.floor(hrs); const endM = (hrs % 1) * 60;
    const endH12 = endH > 12 ? endH - 12 : endH; const endAmPm = endH >= 12 ? 'PM' : 'AM';
    return ` → ${endH12}:${String(endM).padStart(2,'0')} ${endAmPm}`;
  })() : '';
  const rows = [
    ['Phone',       l.phone ? `<a href="tel:${escAttr(l.phone)}" style="color:var(--accent-deep)">${esc(l.phone)}</a>` : '—'],
    ['Email',       l.email ? `<a href="mailto:${escAttr(l.email)}" style="color:var(--accent-deep)">${esc(l.email)}</a>` : '—'],
    ['Service',     esc(l.service_type) || '—'],
    ['Move size',   esc(l.items_size) || '—'],
    ['Pickup',      esc(l.pickup_address) || '—'],
    ['Drop-off',    esc(l.dropoff_address) || '—'],
    ['Date',        esc(l.preferred_date) || '—'],
    ['Time',        l.preferred_time ? `${esc(l.preferred_time)}${endTimeLabel}` : '—'],
    ['Est. duration', `<span style="font-weight:700;color:#5E35B1">${fmtDuration(hrs)}</span>`],
    ['Parking',     esc(l.parking) || '—'],
    ['Stairs (pickup)', (esc(l.stairs_pickup) || '—') + ((l.stairs_pickup === 'Stairs' || l.stairs_pickup === 'Both') && l.flights_pickup ? ` · ${l.flights_pickup} flight${l.flights_pickup>1?'s':''}` : '')],
    ['Stairs (drop)',   (esc(l.stairs_dropoff) || '—') + ((l.stairs_dropoff === 'Stairs' || l.stairs_dropoff === 'Both') && l.flights_dropoff ? ` · ${l.flights_dropoff} flight${l.flights_dropoff>1?'s':''}` : '')],
    ['Common items',    esc(common)],
    ['Special items',   esc(special)],
    ['Boxed up',    (esc(l.items_boxed) || '—') + (l.box_count ? ` · ${l.box_count} boxes` : '')],
    ['Packing service', (l.packing_service != null ? l.packing_service : (l.items_boxed === 'Not yet')) ? '<span style="color:#27ae60;font-weight:700">Yes (+35%)</span>' : (l.items_boxed === 'Not yet' ? '<span style="color:var(--ink3)">Declined</span>' : '—')],
    ['Partial load', (l.partial_load && (l.items_size === 'Studio' || l.items_size === '1 BR')) ? '<span style="color:#27ae60;font-weight:700">Yes (−25%)</span>' : '—'],
    ['Prep needed', Array.isArray(l.prep_needed) && l.prep_needed.length ? esc(l.prep_needed.join(', ')) : '—'],
    ['Home staging', l.staging ? '<span style="color:#27ae60;font-weight:700">Yes (+30%)</span>' : '—'],
    ['Items list',  esc(l.items_list) || '—'],
    ['Other notes', esc(l.other_notes) || '—'],
    ['Payment',     l.payment_status === 'paid' ? `<span style="color:#27ae60;font-weight:700">Paid (${l.deposit_cents ? '$'+Math.round(l.deposit_cents/100) : '—'})</span>` : l.payment_status === 'pending' ? '<span style="color:#e67e22;font-weight:600">Pending</span>' : '<span style="color:var(--muted)">Unpaid</span>'],
  ];
  if (includeFlow) rows.push(['Stopped on', `<span style="color:var(--accent-deep);font-weight:700">${esc(leadStopStep(l))}</span>`]);
  rows.push(['Submitted', fmt(l.created_at)]);
  return rows.map(([label, val]) => `<div class="modal-row"><div class="modal-label">${label}</div><div class="modal-value">${val}</div></div>`).join('');
}

function openLeadModal(id) {
  const l = cache.leads.find(x => x.id === id);
  if (!l) return;
  const cal = gcalLink(l);
  const rows = leadCustomerRows(l, true);

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="position:relative">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        ${l.deleted_at
          ? `<button onclick="restoreLead('${l.id}')" style="position:absolute;top:16px;right:56px;padding:7px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">Restore</button>`
          : `<button onclick="deleteLead('${l.id}')" style="position:absolute;top:16px;right:56px;padding:7px 14px;background:var(--error);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer">Delete</button>`}
        <h2>${l.lead_number ? '<span style="color:var(--accent-deep);font-size:16px;font-weight:700">#'+l.lead_number+'</span> ' : ''}${esc(l.name) || 'Lead'}</h2>
        ${rows}
        ${renderLeadPrice(l)}
        ${renderLeadPhotos(l)}
        ${cal ? `<a class="gcal-btn" href="${cal}" target="_blank">📅 Add to Google Calendar</a>` : ''}
      </div>
    </div>`;
}

// Human-readable label for where a lead abandoned the flow.
const GIG_STEP_LABELS = { locations:'Locations', size:'Move size', inventory:'Inventory', crew:'Crew & truck', extras:'Extras', schedule:'Schedule', contact:'Contact info', review:'Review' };
function leadStopStep(l) {
  if (l._isDraftGig) return GIG_STEP_LABELS[l.draft_step] || l.draft_step || 'In progress';
  if (l.status === 'submitted') return 'Completed form · unpaid';
  return l.progress_step || 'Just started';
}

let leadTab = 'open';
let gigTab = 'active';
function renderLeads() {
  // Leads = people who STARTED the website intake form or the in-app gig wizard
  // but did NOT finish/pay. Anyone who paid is converted to a gig (Gigs tab).
  // Soft-deleted leads move to the Deleted tab.
  const webLeads = (cache.leads || []).filter(l => !l.deleted_at && l.payment_status !== 'paid' && l.status !== 'booked');
  const deletedLeads = (cache.leads || []).filter(l => l.deleted_at);
  const draftGigs = (cache.gigs || []).filter(g => g.status === 'draft').map(g => ({ ...g, _isDraftGig: true }));
  const open = [...webLeads, ...draftGigs].sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

  const list = leadTab === 'deleted' ? deletedLeads : open;

  const card = (l, i) => {
    if (l._isDraftGig) {
      const name = profileName(l.customer_id) || 'App user';
      const size = esc(l.home_size) || '—';
      const where = esc((l.from_address || '—').split(',')[0]);
      return `<div class="lead-card" style="animation:cardIn 0.36s cubic-bezier(0.16,1,0.3,1) ${i*50}ms both" onclick="showGigModal('${l.id}')">
        <div class="lead-card-name">${esc(name)} <span style="background:#5E35B1;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px">APP DRAFT</span></div>
        <div class="lead-card-meta">${fmt(l.created_at)} · Stopped on: <strong style="color:#5E35B1">${esc(leadStopStep(l))}</strong></div>
        <div class="lead-card-row"><span>Moving</span><span>${size}</span></div>
        <div class="lead-card-row"><span>📍 ${where}</span><span>${l.scheduled_for ? fmt(l.scheduled_for) : 'ASAP'}</span></div>
      </div>`;
    }
    const price = l.estimated_price_cents ? `<span class="lead-price">$${Math.round(l.estimated_price_cents/100).toLocaleString()}</span>` : '';
    const leadNum = l.lead_number ? `<span style="font-size:11px;font-weight:700;color:var(--accent-deep);margin-right:6px">#${l.lead_number}</span>` : '';
    const srcBadge = l.deleted_at
      ? '<span style="background:var(--error);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px">DELETED</span>'
      : l.status === 'submitted'
        ? '<span style="background:#e67e22;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px">UNPAID</span>'
        : '<span style="background:#999;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px;margin-left:6px">ABANDONED</span>';
    return `<div class="lead-card" style="animation:cardIn 0.36s cubic-bezier(0.16,1,0.3,1) ${i*50}ms both;${l.deleted_at ? 'opacity:0.7;' : ''}" onclick="openLeadModal('${l.id}')">
      <div class="lead-card-name">${leadNum}${esc(l.name) || 'Unknown'} ${price}${srcBadge}</div>
      <div class="lead-card-meta">${esc(l.phone) || ''} · ${fmt(l.created_at)} · Stopped on: <strong style="color:var(--accent-deep)">${esc(leadStopStep(l))}</strong></div>
      <div class="lead-card-row"><span>${esc(l.service_type) || 'Move'}</span><span>${esc(l.items_size) || '—'}</span></div>
      <div class="lead-card-row"><span>📍 ${esc((l.pickup_address || '—').split(',')[0])}</span><span>${esc(l.preferred_date) || 'Date TBD'}</span></div>
    </div>`;
  };
  const cards = list.map(card).join('');

  const tabStyle = (t) => `padding:8px 18px;border:1.5px solid ${leadTab===t?'var(--accent)':'var(--border)'};border-radius:999px;background:${leadTab===t?'var(--accent-soft)':'var(--card)'};color:${leadTab===t?'var(--accent-deep)':'var(--muted)'};font-size:13px;font-weight:600;cursor:pointer`;

  return `
    <h2 class="page-title">Leads</h2>
    <p class="page-sub">People who started the intake form or app gig wizard but didn't finish. Paid leads become gigs.</p>
    <div style="display:flex;gap:8px;margin-bottom:14px;align-items:center;flex-wrap:wrap">
      <button style="${tabStyle('open')}" onclick="leadTab='open';showPage('leads')">Abandoned (${open.length})</button>
      <button style="${tabStyle('deleted')}" onclick="leadTab='deleted';showPage('leads')">Deleted (${deletedLeads.length})</button>
      <button class="btn-sm refresh-btn" onclick="loadAll().then(()=>showPage('leads'))">Refresh</button>
    </div>
    ${list.length ? cards : '<div class="empty">No ' + (leadTab === 'deleted' ? 'deleted' : 'abandoned') + ' leads.</div>'}`;
}
</script>
</body>
</html>
