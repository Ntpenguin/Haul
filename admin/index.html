<style>
  :root {
    --bg: #FAF7F2; --card: #FFFFFF; --surface: #F2EEE7;
    --line: rgba(26,23,20,0.08); --line2: rgba(26,23,20,0.14);
    --ink: #1A1714; --ink2: #534C44; --ink3: #8B8379; --ink4: #B8B0A4;
    --accent: #C98B3F; --accent-deep: #8B5E2B; --accent-soft: #F5EDE0;
    --success: #4A8066; --success-soft: #E5F0EA;
    --warning: #C98B3F; --warning-soft: #F5EDE0;
    --error: #C84B3A; --error-soft: #FDECEA;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--ink); }

  /* Login */
  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .login-box { background: var(--card); border-radius: 20px; padding: 40px; max-width: 400px; width: 100%; box-shadow: 0 4px 24px rgba(26,23,20,0.08); }
  .login-box h1 { font-size: 24px; font-weight: 700; margin-bottom: 6px; letter-spacing: -0.5px; }
  .login-box p { font-size: 14px; color: var(--ink3); margin-bottom: 24px; }
  .login-box label { display: block; font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .login-box input { width: 100%; height: 48px; padding: 0 14px; border: 1.5px solid var(--line2); border-radius: 10px; font-size: 15px; color: var(--ink); background: var(--bg); margin-bottom: 16px; outline: none; }
  .login-box input:focus { border-color: var(--accent); }
  .login-box button { width: 100%; height: 50px; border: none; border-radius: 12px; background: var(--accent); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .login-box button:hover { opacity: 0.9; }
  .login-error { font-size: 13px; color: var(--error); margin-bottom: 12px; font-weight: 500; }

  /* Layout */
  #app { display: none; }
  .topbar { background: var(--card); border-bottom: 1px solid var(--line); padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .topbar h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .topbar-right { display: flex; align-items: center; gap: 12px; }
  .topbar-right span { font-size: 13px; color: var(--ink3); }
  .btn-sm { height: 34px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 8px; background: var(--card); font-size: 13px; font-weight: 600; color: var(--ink2); cursor: pointer; transition: background .15s, transform .1s; }
  .btn-sm:hover { background: var(--surface); }
  .btn-sm:active { transform: scale(0.96); }

  .layout { display: flex; min-height: calc(100vh - 65px); }
  .sidebar { width: 220px; background: var(--card); border-right: 1px solid var(--line); padding: 16px 0; flex-shrink: 0; }
  .sidebar a { display: flex; align-items: center; gap: 10px; padding: 10px 20px; font-size: 14px; font-weight: 500; color: var(--ink2); text-decoration: none; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .sidebar a:hover { background: var(--surface); }
  .sidebar a:active { transform: scale(0.97); }
  .sidebar a.active { background: var(--accent-soft); color: var(--accent-deep); font-weight: 700; }
  .sidebar .nav-icon { width: 20px; text-align: center; font-size: 16px; }

  .main { flex: 1; padding: 28px; overflow-x: auto; }
  .page-title { font-size: 22px; font-weight: 700; letter-spacing: -0.4px; margin-bottom: 6px; }
  .page-sub { font-size: 14px; color: var(--ink3); margin-bottom: 24px; }

  /* Stats */
  .stats-row { display: flex; gap: 14px; margin-bottom: 28px; flex-wrap: wrap; }
  .stat-card { background: var(--card); border-radius: var(--radius); padding: 18px 22px; flex: 1; min-width: 160px; box-shadow: 0 2px 12px rgba(26,23,20,0.04); border: 1px solid var(--line); }
  .stat-label { font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
  .stat-value { font-size: 28px; font-weight: 700; letter-spacing: -1px; }
  .stat-value.accent { color: var(--accent); }
  .stat-value.success { color: var(--success); }
  .stat-value.warning { color: var(--warning); }

  /* Tables */
  .table-wrap { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); overflow: hidden; box-shadow: 0 2px 12px rgba(26,23,20,0.04); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  thead th { background: var(--surface); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tbody td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }

  tbody tr:hover { background: var(--accent-soft); }
  tbody tr:last-child td { border-bottom: none; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  .badge-posted { background: var(--accent-soft); color: var(--accent-deep); }
  .badge-matched, .badge-in_progress { background: #E3EEF5; color: #2E5470; }
  .badge-completed { background: var(--success-soft); color: var(--success); }
  .badge-cancelled, .badge-rejected, .badge-failed { background: var(--error-soft); color: var(--error); }
  .badge-draft, .badge-pending { background: var(--surface); color: var(--ink3); }
  .badge-approved { background: var(--success-soft); color: var(--success); }
  .badge-customer { background: var(--accent-soft); color: var(--accent-deep); }
  .badge-mover { background: #E5F0EA; color: #2E5C47; }
  .badge-both { background: #E3EEF5; color: #2E5470; }
  .badge-accepted { background: var(--success-soft); color: var(--success); }
  .badge-declined, .badge-withdrawn { background: var(--error-soft); color: var(--error); }

  .photo-thumb { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; cursor: pointer; }
  .photo-thumb:hover { opacity: 0.8; }
  .empty { text-align: center; padding: 40px; color: var(--ink3); font-size: 14px; }
  .loading { text-align: center; padding: 40px; color: var(--ink4); }
  .refresh-btn { margin-bottom: 16px; }
  .detail-link { color: var(--accent-deep); font-weight: 600; cursor: pointer; text-decoration: underline; }

  /* Modal */
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.95) translateY(8px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }
  @keyframes overlayIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes sheetIn {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(26,23,20,0.5); display: flex; align-items: center; justify-content: center; z-index: 100; animation: overlayIn 0.18s ease; }
  .modal { background: var(--card); border-radius: 20px; padding: 28px; max-width: 600px; width: 90%; max-height: 80vh; overflow-y: auto; box-shadow: 0 16px 48px rgba(26,23,20,0.2); animation: modalIn 0.28s cubic-bezier(0.16,1,0.3,1); }
  .modal h2 { font-size: 20px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.3px; }
  .modal-row { display: flex; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .modal-label { font-size: 12px; font-weight: 700; color: var(--ink3); text-transform: uppercase; width: 130px; flex-shrink: 0; padding-top: 2px; }
  .modal-value { font-size: 14px; color: var(--ink); flex: 1; word-break: break-word; }
  .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 16px; border: none; background: var(--surface); cursor: pointer; font-size: 16px; color: var(--ink2); }
  .modal-photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .modal-photos img { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; }

  /* Calendar */
  .cal-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .cal-header button { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line2); background: var(--card); cursor: pointer; font-size: 16px; color: var(--ink2); display: flex; align-items: center; justify-content: center; }
  .cal-header button:hover { background: var(--surface); }
  .cal-month { font-size: 18px; font-weight: 700; min-width: 180px; text-align: center; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); box-shadow: 0 2px 12px rgba(26,23,20,0.04); }
  .cal-day-label { padding: 10px 6px; text-align: center; font-size: 11px; font-weight: 700; color: var(--ink3); text-transform: uppercase; background: var(--surface); border-bottom: 1px solid var(--line); }
  .cal-cell { min-height: 110px; padding: 6px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); vertical-align: top; position: relative; }
  .cal-cell:nth-child(7n) { border-right: none; }
  .cal-cell.other-month { background: var(--surface); opacity: 0.5; }
  .cal-cell.today { background: var(--accent-soft); }
  .cal-date { font-size: 12px; font-weight: 700; color: var(--ink3); margin-bottom: 4px; }
  .cal-cell.today .cal-date { color: var(--accent-deep); }
  .cal-gig { padding: 4px 6px; margin-bottom: 3px; border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-gig:hover { opacity: 0.8; }
  .cal-gig.status-posted { background: var(--accent-soft); color: var(--accent-deep); border-left: 3px solid var(--accent); }
  .cal-gig.status-matched, .cal-gig.status-in_progress { background: #E3EEF5; color: #2E5470; border-left: 3px solid #4A7FA0; }
  .cal-gig.status-completed { background: var(--success-soft); color: var(--success); border-left: 3px solid var(--success); }
  .cal-gig.status-cancelled { background: var(--error-soft); color: var(--error); border-left: 3px solid var(--error); }
  .cal-gig.status-draft { background: var(--surface); color: var(--ink3); border-left: 3px solid var(--ink4); }
  .cal-gig.asap-gig { background: var(--warning-soft); color: var(--accent-deep); border-left: 3px solid var(--warning); }
  .cal-gig.lead { background: #EDE7F6; color: #5E35B1; border-left: 3px solid #7E57C2; }
  .cal-gig.blocked { background: #FFEBEE; color: #C62828; border-left: 3px solid #E53935; }
  .cal-gig.blocked .block-x { cursor: pointer; margin-left: 4px; font-weight: 700; opacity: 0.6; }
  .cal-gig.blocked .block-x:hover { opacity: 1; }
  .block-form { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 16px; padding: 16px; background: var(--surface); border-radius: 10px; border: 1px solid var(--border); }
  .block-form label { font-size: 12px; font-weight: 600; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; }
  .block-form input, .block-form select { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; }
  .block-form button { padding: 8px 16px; border-radius: 8px; border: none; background: #C62828; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer; }
  .block-form button:hover { background: #B71C1C; }
  .blocked-list { margin-top: 12px; }
  .blocked-list table { width: 100%; }
  .blocked-list td, .blocked-list th { padding: 8px 12px; font-size: 13px; }
  .cal-gig .cal-dur { font-size: 9px; font-weight: 400; opacity: 0.7; }
  .cal-more { font-size: 10px; color: var(--ink3); font-weight: 600; padding: 2px 6px; cursor: pointer; }
  .cal-more:hover { color: var(--accent-deep); }
  .cal-legend { display: flex; gap: 16px; margin-top: 16px; flex-wrap: wrap; }
  .cal-legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); }
  .cal-legend-dot { width: 10px; height: 10px; border-radius: 3px; }
  .cal-asap-section { margin-top: 24px; }
  .cal-asap-section h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }

  .worker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .worker-card { background: var(--card); border-radius: 16px; border: 1px solid var(--line); padding: 20px; box-shadow: 0 2px 12px rgba(26,23,20,0.04); cursor: pointer; transition: box-shadow .2s, transform .15s cubic-bezier(0.34,1.56,0.64,1); }
  .worker-card:hover { box-shadow: 0 6px 24px rgba(26,23,20,0.10); transform: translateY(-2px); }
  .worker-card:active { transform: scale(0.98); }
  .worker-card-header { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
  .worker-avatar { width: 56px; height: 56px; border-radius: 28px; background: var(--surface); object-fit: cover; flex-shrink: 0; }
  .worker-avatar-placeholder { width: 56px; height: 56px; border-radius: 28px; background: var(--accent-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: var(--accent-deep); flex-shrink: 0; }
  .worker-name { font-size: 16px; font-weight: 700; color: var(--ink); }
  .worker-meta { font-size: 12px; color: var(--ink3); margin-top: 2px; }
  .worker-info-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
  .worker-info-row:last-child { border-bottom: none; }
  .worker-info-label { font-weight: 700; color: var(--ink3); min-width: 90px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; padding-top: 1px; }
  .skill-tag { display: inline-block; padding: 3px 8px; border-radius: 6px; background: var(--accent-soft); color: var(--accent-deep); font-size: 11px; font-weight: 600; margin: 2px 2px 2px 0; }
  .selfie-thumb { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; cursor: pointer; border: 1px solid var(--line); }

  /* Lead cards (mobile) */
  .lead-card { background: var(--card); border-radius: 14px; border: 1px solid var(--line); padding: 16px; margin-bottom: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(26,23,20,0.04); transition: box-shadow .2s, transform .15s cubic-bezier(0.34,1.56,0.64,1); }
  .lead-card:hover { box-shadow: 0 6px 20px rgba(26,23,20,0.10); transform: translateY(-1px); }
  .lead-card:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(26,23,20,0.04); }
  .lead-card-name { font-size: 16px; font-weight: 700; color: var(--ink); margin-bottom: 4px; }
  .lead-card-meta { font-size: 13px; color: var(--ink3); margin-bottom: 8px; }
  .lead-card-row { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--ink2); padding: 4px 0; border-bottom: 1px solid var(--line); }
  .lead-card-row:last-child { border-bottom: none; }
  .lead-price { font-size: 18px; font-weight: 800; color: var(--accent-deep); }
  .gcal-btn { display: inline-flex; align-items: center; gap: 6px; margin-top: 14px; padding: 9px 16px; background: #4285F4; color: #fff; border-radius: 10px; font-size: 13px; font-weight: 700; text-decoration: none; }
  .gcal-btn:hover { opacity: 0.9; }

  @media (max-width: 768px) {
    .sidebar { position: fixed; bottom: 0; left: 0; right: 0; width: 100%; height: auto; border-right: none; border-top: 1px solid var(--line); display: flex; flex-direction: row; padding: 0; z-index: 20; overflow-x: auto; }

    .sidebar .nav-icon { width: auto; font-size: 18px; }
    .layout { flex-direction: column; min-height: calc(100vh - 57px); }
    .main { padding: 14px 14px 80px; overflow-x: hidden; }
    .page-title { font-size: 18px; }
    .stats-row { flex-direction: column; gap: 10px; }
    .worker-grid { grid-template-columns: 1fr; }
    .table-wrap { overflow-x: auto; }
    .topbar { padding: 12px 16px; }
    .topbar h1 { font-size: 15px; }
    .topbar-right span { display: none; }
    .modal { max-height: 90vh; border-radius: 20px 20px 0 0; position: fixed; bottom: 0; left: 0; right: 0; width: 100%; max-width: 100%; animation: sheetIn 0.32s cubic-bezier(0.16,1,0.3,1); }
    .modal-overlay { align-items: flex-end; }
  }
</style>

<script>
const SUPABASE_URL = 'https://joiukvttuamaanrgzfrz.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvaXVrdnR0dWFtYWFucmd6ZnJ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwNTY5ODksImV4cCI6MjA5NDYzMjk4OX0.TcpzGaMihyKUZNtuRncasXImyv6bb0De1lf_wQa61Ew';

// "Remember me": when ON, the session lives in localStorage (persists across
// browser restarts); when OFF, it lives in sessionStorage (cleared when the tab
// closes). The flag itself is in localStorage so the choice is remembered.
const REMEMBER_KEY = 'ffw_admin_remember';
const authStore = {
  _s: () => (localStorage.getItem(REMEMBER_KEY) === '0' ? sessionStorage : localStorage),
  getItem: (k) => authStore._s().getItem(k),
  setItem: (k, v) => authStore._s().setItem(k, v),
  removeItem: (k) => { localStorage.removeItem(k); sessionStorage.removeItem(k); },
};
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storage: authStore },
});
// Prefill the saved email + remember choice on the login screen.
(function restoreLogin() {
  const remembered = localStorage.getItem(REMEMBER_KEY) !== '0';
  const cb = document.getElementById('login-remember');
  if (cb) cb.checked = remembered;
  const savedEmail = localStorage.getItem('ffw_admin_email');
  const emailEl = document.getElementById('login-email');
  if (emailEl && savedEmail) emailEl.value = savedEmail;
})();

let cache = { profiles: [], moverProfiles: [], gigs: [], applications: [], photos: [], leads: [] };

// ─── Auth ────────────────────────────────────
async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pw = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!email || !pw) { errEl.textContent = 'Enter email and password'; errEl.style.display = 'block'; return; }
  // Set the remember choice BEFORE signing in so the session is stored in the
  // right place (local vs session storage).
  const remember = (document.getElementById('login-remember') || {}).checked !== false;
  localStorage.setItem(REMEMBER_KEY, remember ? '1' : '0');
  if (remember) localStorage.setItem('ffw_admin_email', email); else localStorage.removeItem('ffw_admin_email');
  const { error } = await sb.auth.signInWithPassword({ email, password: pw });
  if (error) { errEl.textContent = error.message; errEl.style.display = 'block'; return; }
  await initApp();
}

async function doLogout() {
  await sb.auth.signOut();
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
}

async function initApp() {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('admin-email').textContent = session.user.email;
  await loadAll();
  showPage('overview');
}

// ─── Navigation ──────────────────────────────
let currentPage = 'overview';
function showPage(page) {
  currentPage = page;
  document.querySelectorAll('.sidebar a').forEach(a => a.classList.remove('active'));
  const links = document.querySelectorAll('.sidebar a');
  const pages = ['overview','users','movers','businesses','gigs','applications','photos','leads','calendar','referrals','bizjobs','pricing','crew','schedule'];
  const idx = pages.indexOf(page);
  if (idx >= 0 && links[idx]) links[idx].classList.add('active');

  const main = document.getElementById('main-content');
  switch(page) {
    case 'overview': main.innerHTML = renderOverview(); break;
    case 'users': main.innerHTML = renderUsers(); break;
    case 'movers': main.innerHTML = renderMovers(); break;
    case 'businesses': main.innerHTML = renderBusinesses(); break;
    case 'gigs': main.innerHTML = renderGigs(); break;
    case 'applications': main.innerHTML = renderApplications(); break;
    case 'photos': main.innerHTML = renderPhotos(); break;
    case 'calendar': main.innerHTML = renderCalendar(); break;
    case 'leads': main.innerHTML = renderLeads(); break;
    case 'referrals': main.innerHTML = renderReferrals(); break;
    case 'bizjobs': main.innerHTML = renderBusinessJobs(); break;
    case 'pricing': main.innerHTML = renderPricing(); break;
    case 'crew': main.innerHTML = renderCrew(); break;
    case 'schedule': main.innerHTML = renderSchedule(); break;
  }
}

// Submitted via landing/business.html -> submit-business-job edge fn, which already
// decided accept/counter/pending. Admin reviews countered/pending here.
function bizBadge(d) {
  const m = { accepted: ['#1f7a4d', '#e6f6ee'], countered: ['#8B6914', '#FFF8E7'], pending: ['#534C44', '#F2EEE7'] };
  const [c, bg] = m[d] || m.pending;
  return `<span style="background:${bg};color:${c};padding:2px 9px;border-radius:6px;font-size:11px;font-weight:700">${esc(d || '—')}</span>`;
}

// Book (manual accept) a business job → bill-business-job creates the UNPAID gig
// and emails the business a Stripe pay-link. Same path as auto-accept.
async function bookBizJob(id) {
  const j = (cache.businessJobs || []).find(x => x.id === id);
  if (!j) return;
  const price = j.counter_price_cents || j.offered_price_cents || j.recommended_price_cents || 0;
  if (price < 50) { alert('Set a price first — use “Set the price” in the job, then Book.'); return; }
  if (!j.customer_email) { if (!confirm('No email on file for this business — the pay-link can\'t be emailed (you\'ll get a link to send manually). Continue?')) return; }
  if (!confirm(`Accept & bill this job at ${dollars(price)}? A Stripe pay-link will be emailed to the business.`)) return;
  const { data, error } = await sb.functions.invoke('bill-business-job', { body: { business_job_id: id } });
  const errMsg = error ? (data && data.error) || error.message || String(error) : (data && data.error);
  if (errMsg) { alert('Could not bill: ' + errMsg); return; }
  alert('Job accepted — pay-link emailed to the business.' + (data && data.url ? '\n\nLink: ' + data.url : ''));
  await loadAll(); showPage('bizjobs');
}
async function declineBizJob(id) {
  if (!confirm('Decline this business job?')) return;
  const { error } = await sb.from('business_jobs').update({ status: 'declined', decided_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Could not decline: ' + error.message); return; }
  await loadAll(); showPage('bizjobs');
}
// Mark a booked business job's gig as completed (and the job itself).
async function completeBizGig(id) {
  const j = (cache.businessJobs || []).find(x => x.id === id);
  if (!j || !j.gig_id) { alert('No linked gig to complete.'); return; }
  if (!confirm('Mark this business job\'s gig as completed?')) return;
  const { error: gErr } = await sb.from('gigs').update({ status: 'completed' }).eq('id', j.gig_id);
  if (gErr) { alert('Could not complete gig: ' + gErr.message); return; }
  await sb.from('business_jobs').update({ status: 'completed' }).eq('id', id);
  await loadAll(); showBusinessJobModal(id);
}
// Admin: set the agreed price (+ optional note) on a business job, then Book to bill.
async function counterBizJob(id) {
  const amt = parseFloat((document.getElementById('biz-counter-amt') || {}).value);
  if (!(amt > 0)) { alert('Enter a price greater than 0.'); return; }
  const note = ((document.getElementById('biz-counter-note') || {}).value || '').trim();
  const { error } = await sb.from('business_jobs').update({
    counter_price_cents: Math.round(amt * 100),
    decision_reason: note || null,
    status: 'new', decided_at: new Date().toISOString(),
  }).eq('id', id);
  if (error) { alert('Could not save price: ' + error.message); return; }
  await loadAll(); showBusinessJobModal(id);
}

    referred: refs.length,

  };
}

async function createReferralCode() {
  const v = id => ((document.getElementById(id) || {}).value || '').trim();
  const name = v('ref-name'), email = v('ref-email'), phone = v('ref-phone'), payout = v('ref-payout');
  if (!name && !email) { alert('Enter at least a referrer name or email.'); return; }
  let code = v('ref-code').replace(/[^A-Za-z0-9-]/g, '').toUpperCase();
  if (!code) {
    const base = (name.split(/\s+/)[0] || 'REF').replace(/[^A-Za-z0-9]/g, '').toUpperCase().slice(0, 8) || 'REF';
    code = base + '-' + Math.floor(1000 + Math.random() * 9000);
  }
  const { error } = await sb.from('referral_codes').insert({
    code, referrer_name: name || null, referrer_email: email || null, referrer_phone: phone || null,
    payout_handle: payout || null, reward_cents: 2000, active: true,
  });
  if (error) { alert(/duplicate|unique/i.test(error.message) ? 'That code already exists — pick another.' : 'Could not create: ' + error.message); return; }
  await loadAll();
  showPage('referrals');
}
async function markReferralPaid(id) {

  if (error) { alert('Could not update: ' + error.message); return; }
  await loadAll();
  showPage('referrals');
}
async function toggleReferralActive(id, active) {

  await loadAll();
  showPage('referrals');
}

  const fld = 'padding:8px 10px;border:1.5px solid var(--line2);border-radius:8px;font-size:14px';
  const accentBtn = 'padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer';

  const gigOpts = (cache.gigs||[]).filter(g=>g.status!=='draft')
    .map(g=>`<option value="${escAttr(g.id)}" data-payout="${g.mover_payout_cents||0}">${esc(gigLabel(g))}${g.mover_payout_cents?(' — '+fmtMoney(g.mover_payout_cents)):''}</option>`).join('');
  const workerOpts = movers.map(m=>`<option value="${escAttr(m.id)}">${esc(moverName(m.id))}</option>`).join('');

  const cards = movers.length ? movers.map(m=>{
    const owed = crewOwed(m.id), paid = crewPaid(m.id);
    const profile = (cache.profiles||[]).find(p=>p.id===m.id) || {};
    const rows = payouts.filter(p=>p.worker_id===m.id)
      .sort((a,b)=> (a.status===b.status ? 0 : a.status==='owed' ? -1 : 1))
      .map(p=>{
        const g = gigById(p.gig_id);
        const label = g ? gigLabel(g) : (p.note || 'Ad-hoc payout');
        return `<tr>
          <td>${esc(label)}</td>
          <td>${fmtMoney(p.amount_cents)}</td>
          <td>${p.status==='paid'
            ? `<span style="color:var(--success);font-weight:700">paid</span>${p.paid_at?` · <span style="color:var(--ink3);font-size:12px">${fmt(p.paid_at)}</span>`:''}`
            : `<span style="color:#8B6914;font-weight:700">owed</span>`}</td>
          <td style="text-align:right;white-space:nowrap">
            ${p.status==='owed'?`<button onclick="markWorkerPayoutPaid('${p.id}')" style="padding:4px 10px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer">Mark $${(p.amount_cents/100).toFixed(0)} paid</button>`:''}
            <button onclick="deleteWorkerPayout('${p.id}')" title="Delete entry" style="margin-left:6px;padding:4px 8px;background:var(--surface);border:1px solid var(--line2);border-radius:6px;font-size:12px;cursor:pointer">&times;</button>
          </td>
        </tr>`;
      }).join('') || `<tr><td colspan="4" class="empty">No payouts logged yet.</td></tr>`;
    return `<div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
        <div style="min-width:0">
          <div style="font-size:16px;font-weight:800;color:var(--ink);cursor:pointer" onclick="showWorkerModal('${m.id}')">${esc(moverName(m.id))} <span style="font-size:11px;font-weight:600;color:var(--ink3)">${badge(m.status)}</span></div>
          <div style="font-size:12px;color:var(--ink3);margin-top:2px">${[profile.phone,profile.email].filter(Boolean).map(esc).join(' · ')||'—'}</div>
        </div>
        <div style="text-align:right;white-space:nowrap">
          <div style="font-size:18px;font-weight:800;color:${owed?'#8B6914':'var(--ink3)'}">${fmtMoney(owed)} <span style="font-size:11px;font-weight:600;color:var(--ink3)">owed</span></div>
          <div style="font-size:12px;color:#1f7a4d">${fmtMoney(paid)} paid</div>
        </div>
      </div>
      <div class="table-wrap" style="margin-top:12px"><table>
        <thead><tr><th>Job</th><th>Amount</th><th>Status</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table></div>
    </div>`;
  }).join('') : `<p class="empty">No workers yet — they appear here once approved in the <b>Workers</b> tab (web signup or “+ Add worker”).</p>`;

  return `
    <h2 class="page-title">Crew &amp; pay</h2>
    <p class="page-sub">${movers.length} worker${movers.length===1?'':'s'} · <b style="color:#8B6914">${fmtMoney(totalOwed)} owed</b>. Same workers as the Workers tab — log a manual payout per job (cash/Venmo/Zelle), then mark paid.</p>

    <div style="background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:18px;max-width:560px">
      <div style="font-size:12px;font-weight:700;color:var(--accent-deep);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Log a payout</div>
      ${movers.length ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end">
        <select id="wp-worker" style="${fld};flex:1;min-width:120px">${workerOpts}</select>
        <select id="wp-gig" onchange="wpFillAmount()" style="${fld};flex:2;min-width:190px"><option value="">Ad-hoc (no job)</option>${gigOpts}</select>
        <input id="wp-amount" type="number" min="0" step="0.01" placeholder="$ amount" style="${fld};width:110px">
        <button onclick="logWorkerPayout()" style="${accentBtn}">Add</button>
      </div>
      <div style="font-size:11px;color:var(--ink3);margin-top:6px">Pick a job to auto-fill its mover payout, or type a custom amount.</div>`
      : `<p style="font-size:13px;color:var(--ink3);margin:0">No workers yet — approve one in the Workers tab first.</p>`}
    </div>

    <div>${cards}</div>
  `;
}
function wpFillAmount(){
  const sel = document.getElementById('wp-gig'), amt = document.getElementById('wp-amount');
  if(!sel || !amt) return;
  const opt = sel.options[sel.selectedIndex];
  const cents = opt ? parseInt(opt.dataset.payout||'0', 10) : 0;
  if(cents > 0) amt.value = (cents/100).toFixed(2);
}
async function logWorkerPayout(){
  const worker_id = (document.getElementById('wp-worker')||{}).value;
  if(!worker_id){ alert('Pick a worker.'); return; }
  const gig_id = (document.getElementById('wp-gig')||{}).value || null;
  const dollars = parseFloat((document.getElementById('wp-amount')||{}).value);
  if(isNaN(dollars) || dollars < 0){ alert('Enter a valid amount.'); return; }
  const { error } = await sb.from('worker_payouts').insert({ worker_id, gig_id, amount_cents: Math.round(dollars*100), status:'owed' });
  if(error){ alert('Could not log payout: ' + error.message); return; }
  await loadAll(); showPage('crew');
}
async function markWorkerPayoutPaid(id){
  if(!confirm('Mark this payout as paid? (Pay the worker first via cash/Venmo/Zelle.)')) return;
  const { error } = await sb.from('worker_payouts').update({ status:'paid', paid_at:new Date().toISOString() }).eq('id', id);
  if(error){ alert('Could not update: ' + error.message); return; }
  await loadAll(); showPage('crew');
}
async function deleteWorkerPayout(id){
  if(!confirm('Delete this payout entry?')) return;
  const { error } = await sb.from('worker_payouts').delete().eq('id', id);
  if(error){ alert('Could not delete: ' + error.message); return; }
  await loadAll(); showPage('crew');
}

// ─── Job planning (read-only): prep/handling summary + a derived gear list ───
// Pulls from the gig + its linked consumer lead (common_item_details/prep_needed)
// or business job (special_items). No DB writes — just surfaces what's collected.
function jobHandlingNeeds(g, lead, biz){
  const needs = [];
  const heavy = [...new Set([...(g.heavy_items||[]), ...(lead?lead.special_items||[]:[]), ...(biz?biz.special_items||[]:[])].filter(Boolean))];
  heavy.filter(h=>h!=='Nope — just regular stuff').forEach(h=>needs.push('Special item: '+h));
  if(lead && lead.common_item_details && typeof lead.common_item_details==='object'){
    for(const [item, attrs] of Object.entries(lead.common_item_details)){
      const on = Object.entries(attrs||{}).filter(([,c])=>c>0).map(([a])=>a);
      if(on.length) needs.push(item+' — '+on.join(', ').toLowerCase());
    }
  }
  if(lead && Array.isArray(lead.prep_needed)) lead.prep_needed.filter(p=>p && p!=='None — ready to go').forEach(p=>needs.push('Prep: '+p));
  if((lead&&lead.staging)||g.staging) needs.push('Home staging');
  if((lead&&lead.packing_service)||g.packing_service) needs.push('Packing service');
  return needs;
}
function gearChecklist(g, lead, biz){
  const gear = new Set(['Furniture dolly','Hand truck','Moving blankets','Ratchet straps','Shrink wrap','Floor / door-jamb protection']);
  if((g.stairs_from||0)+(g.stairs_to||0) > 0) gear.add('Stair-climbing dolly');
  if(g.long_carry || (biz&&biz.long_walk)) gear.add('Extra dolly for long carry');
  const items = [...(g.heavy_items||[]), ...(lead?lead.special_items||[]:[]), ...(biz?biz.special_items||[]:[])].join(' | ').toLowerCase();
  const flags = (lead&&lead.common_item_details ? JSON.stringify(lead.common_item_details) : '').toLowerCase();
  const prep = (lead&&Array.isArray(lead.prep_needed) ? lead.prep_needed.join(' ') : '').toLowerCase();
  if(items.includes('piano')) gear.add('Piano dolly + board');
  if(items.includes('pool table')) gear.add('Pool-table breakdown tools');
  if(items.includes('safe')) gear.add('Heavy-duty 4-wheel dolly');
  if(items.includes('refrigerator')||items.includes('fridge')) gear.add('Appliance dolly');
  if(items.includes('aquarium')) gear.add('Aquarium drain kit + padding');
  if(items.includes('tv')||items.includes('artwork')||items.includes('mirror')||flags.includes('wrapping')||prep.includes('unmount tv')) gear.add('TV/mirror box + extra wrap');
  if(items.includes('disassembly')||flags.includes('disassembly')||prep.includes('disassemble')||prep.includes('take apart')) gear.add('Tool kit (drivers, allen keys, wrench)');
  if((lead&&lead.packing_service)||g.packing_service||prep.includes('pack the kitchen')) gear.add('Boxes, paper, tape, bubble wrap');
  if((lead&&lead.staging)||g.staging) gear.add('Furniture pads + staging supplies');
  return [...gear];
}
function jobPlanningSection(g, lead, biz){
  const needs = jobHandlingNeeds(g, lead, biz);
  const gear = gearChecklist(g, lead, biz);
  const diff = g.difficulty!=null ? g.difficulty+'/5 — '+(['Easy','Light','Moderate','Heavy','Expert'][g.difficulty-1]||'') : '—';
  const dur = g.estimated_duration_hours!=null ? '~'+g.estimated_duration_hours+' hrs' : '—';
  const access = `${g.stairs_from||0} flt from / ${g.stairs_to||0} flt to`
    + ((g.elevator_from||g.elevator_to)?` · elevator${g.elevator_from?' (from)':''}${g.elevator_to?' (to)':''}`:'')
    + ((g.long_carry||(biz&&biz.long_walk))?' · long carry':'');
  return `<div style="margin-top:16px;border-top:2px solid var(--accent);padding-top:12px">
    <div class="modal-label" style="color:var(--accent-deep);font-weight:700;margin-bottom:8px">&#129520; Job planning</div>
    <div class="modal-row"><div class="modal-label">Difficulty</div><div class="modal-value">${diff}</div></div>
    <div class="modal-row"><div class="modal-label">Est. duration</div><div class="modal-value">${dur}</div></div>
    <div class="modal-row"><div class="modal-label">Crew / truck</div><div class="modal-value">${g.crew_size||'—'} crew · ${esc(g.truck_size)||'—'} truck</div></div>
    <div class="modal-row"><div class="modal-label">Access</div><div class="modal-value">${access}</div></div>
    <div class="modal-row"><div class="modal-label">Prep / handling</div><div class="modal-value">${needs.length?needs.map(esc).join('<br>'):'Standard — nothing special flagged'}</div></div>
    <div class="modal-row"><div class="modal-label">Gear to bring</div><div class="modal-value">${gear.map(esc).join(' · ')}</div></div>
  </div>`;
}

// ─── Crew assignment + scheduling conflicts (job_crew, migration 055) ────────
function gigSpan(g){
  if(!g || !g.scheduled_for) return null;
  const start=new Date(g.scheduled_for).getTime();
  if(isNaN(start)) return null;
  return [start, start + (g.estimated_duration_hours||2)*3600000];
}
function workerConflict(workerId, gig){
  const span=gigSpan(gig); if(!span) return false;
  return (cache.jobCrew||[]).filter(c=>c.worker_id===workerId && c.gig_id!==gig.id).some(c=>{
    const os=gigSpan(gigById(c.gig_id));
    return os && os[0] < span[1] && span[0] < os[1];
  });
}
function gigCrewSection(g){
  const assigned=(cache.jobCrew||[]).filter(c=>c.gig_id===g.id);
  const roster=activeMovers();
  const assignedIds=new Set(assigned.map(c=>c.worker_id));
  const opts=roster.filter(w=>!assignedIds.has(w.id)).map(w=>`<option value="${escAttr(w.id)}">${esc(moverName(w.id))}</option>`).join('');
  const need=g.crew_size||0;
  const chips=assigned.length?assigned.map(c=>{
    const w=(cache.profiles||[]).find(x=>x.id===c.worker_id);
    const con=workerConflict(c.worker_id,g);
    return `<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;background:${con?'#FBE4DF':'var(--surface)'};border:1px solid ${con?'#E0A99A':'var(--line2)'};border-radius:999px;font-size:13px;margin:0 6px 6px 0">${esc(w?(w.full_name||w.email):'(removed)')}${con?' <span title="Double-booked at this time" style="color:#b4452e;font-weight:700">&#9888;</span>':''}<button onclick="removeCrew('${c.id}')" title="Remove" style="background:none;border:none;color:var(--ink3);cursor:pointer;font-size:15px;line-height:1;padding:0 2px">&times;</button></span>`;
  }).join(''):'<span style="color:var(--ink3);font-size:13px">No crew assigned yet.</span>';
  const countTxt=need?`<span style="font-size:12px;font-weight:600;color:${assigned.length>=need?'var(--success)':'#8B6914'}">${assigned.length}/${need} assigned</span>`:`<span style="font-size:12px;color:var(--ink3)">${assigned.length} assigned</span>`;
  return `<div style="margin-top:16px;border-top:2px solid var(--accent);padding-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div class="modal-label" style="color:var(--accent-deep);font-weight:700">&#128119; Crew assigned</div>${countTxt}
    </div>
    <div style="margin-bottom:8px">${chips}</div>
    ${roster.length?`<div style="display:flex;gap:8px">
      <select id="crew-pick-${g.id}" style="flex:1;padding:8px 10px;border:1.5px solid var(--line2);border-radius:8px;font-size:14px"${opts?'':' disabled'}>${opts||'<option value="">All crew already assigned</option>'}</select>
      <button onclick="assignCrew('${g.id}')" style="padding:9px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer">Assign</button>
    </div>`:`<div style="font-size:12px;color:var(--ink3)">Approve a worker in the <b>Workers</b> tab first.</div>`}
  </div>`;
}
async function assignCrew(gigId){
  // Reads the modal picker OR the inline Schedule-row picker, whichever is present.
  const sel=document.getElementById('crew-pick-'+gigId)||document.getElementById('sched-pick-'+gigId);
  const worker_id=sel&&sel.value;
  if(!worker_id){alert('Pick a worker.');return;}
  const {error}=await sb.from('job_crew').insert({gig_id:gigId, worker_id});
  if(error){alert(/duplicate|unique/i.test(error.message)?'That worker is already on this job.':'Could not assign: '+error.message);return;}
  notifyWorkerAssigned(gigId, worker_id);
  await loadAll();
  if(currentPage==='schedule') showPage('schedule'); else showGigModal(gigId);
}

// Email the worker their assignment (notify-worker-assigned edge fn, admin-gated).
// Fire-and-forget: a failed email never blocks or rolls back the assignment.
async function notifyWorkerAssigned(gigId, workerId){
  try{
    const {error}=await sb.functions.invoke('notify-worker-assigned',{body:{gig_id:gigId, worker_id:workerId}});
    if(error) alert('Worker assigned, but the notification email failed: '+(error.message||'unknown error'));
  }catch(e){
    alert('Worker assigned, but the notification email failed: '+e.message);
  }
}
async function removeCrew(id){
  const c=(cache.jobCrew||[]).find(x=>x.id===id); const gigId=c?c.gig_id:null;
  const {error}=await sb.from('job_crew').delete().eq('id',id);
  if(error){alert('Could not remove: '+error.message);return;}
  await loadAll();
  if(currentPage==='schedule') showPage('schedule'); else if(gigId) showGigModal(gigId);
}
// Day-by-day dispatch view: scheduled gigs grouped by date with assigned crew
// and double-booking warnings.
function renderSchedule(){
  const gigs=(cache.gigs||[]).filter(g=>!g.deleted_at && g.status!=='draft' && g.status!=='cancelled' && g.scheduled_for)
    .sort((a,b)=>new Date(a.scheduled_for)-new Date(b.scheduled_for));
  const byDay={};
  gigs.forEach(g=>{const key=new Date(g.scheduled_for).toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'});(byDay[key]=byDay[key]||[]).push(g);});
  const roster=activeMovers();
  const days=Object.entries(byDay).map(([day,gs])=>{
    const rows=gs.map(g=>{
      const t=new Date(g.scheduled_for).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      const assigned=(cache.jobCrew||[]).filter(c=>c.gig_id===g.id);
      const assignedIds=new Set(assigned.map(c=>c.worker_id));
      const need=g.crew_size||0;
      const short=need&&assigned.length<need;
      const chips=assigned.length?assigned.map(c=>{
        const w=(cache.profiles||[]).find(x=>x.id===c.worker_id);
        const con=workerConflict(c.worker_id,g);
        return `<span style="display:inline-flex;align-items:center;gap:4px;padding:2px 5px 2px 9px;border-radius:999px;font-size:12px;margin:0 4px 4px 0;background:${con?'#FBE4DF':'var(--surface)'};border:1px solid ${con?'#E0A99A':'var(--line2)'}">${esc(w?(w.full_name||w.email):'?')}${con?' <span style="color:#b4452e;font-weight:700" title="Double-booked">&#9888;</span>':''}<button onclick="removeCrew('${c.id}')" title="Remove" style="background:none;border:none;color:var(--ink3);cursor:pointer;font-size:13px;line-height:1;padding:0 1px">&times;</button></span>`;
      }).join(''):'<span style="color:#b4452e;font-size:12px;font-weight:600">&#9888; no crew</span>';
      const availOpts=roster.filter(w=>!assignedIds.has(w.id)).map(w=>`<option value="${escAttr(w.id)}">${esc(moverName(w.id))}</option>`).join('');
      const assignCtrl=availOpts?`<div style="display:flex;gap:6px;margin-top:2px">
          <select id="sched-pick-${g.id}" style="flex:1;min-width:100px;padding:5px 7px;border:1.5px solid var(--line2);border-radius:7px;font-size:12px">${availOpts}</select>
          <button onclick="assignCrew('${g.id}')" style="padding:5px 11px;background:var(--accent);color:#fff;border:none;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer">+ Add</button>
        </div>`:(roster.length?'':'<div style="font-size:11px;color:var(--ink3);margin-top:2px">approve crew in Workers tab</div>');
      return `<tr onclick="showGigModal('${g.id}')" style="cursor:pointer">
        <td style="white-space:nowrap;font-weight:700;vertical-align:top">${t}</td>
        <td style="vertical-align:top">${esc(g.home_size||g.gig_title||'job')}<div style="font-size:12px;color:var(--ink3)">${g.difficulty?('Diff '+g.difficulty+'/5 · '):''}${g.estimated_duration_hours?('~'+g.estimated_duration_hours+'h · '):''}${need?(need+' crew needed'):'crew n/a'}${short?` <span style="color:#8B6914;font-weight:700">(short ${need-assigned.length})</span>`:''}</div></td>
        <td onclick="event.stopPropagation()" style="vertical-align:top;min-width:220px">${chips}${assignCtrl}</td>
      </tr>`;
    }).join('');
    return `<div style="margin-bottom:18px"><div style="font-size:14px;font-weight:800;margin-bottom:8px">${esc(day)}</div>
      <div class="table-wrap"><table><thead><tr><th>Time</th><th>Job</th><th>Crew</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join('');
  return `<h2 class="page-title">Schedule &amp; dispatch</h2>
    <p class="page-sub">${gigs.length} scheduled job${gigs.length===1?'':'s'} · assign crew from each job (click a row). <span style="color:#b4452e">&#9888;</span> = a worker double-booked across overlapping jobs.</p>
    <button class="btn-sm refresh-btn" onclick="loadAll().then(()=>showPage('schedule'))" style="margin-bottom:14px">Refresh</button>
    ${gigs.length?days:'<p class="empty">No scheduled jobs yet.</p>'}`;
}

// ─── Helpers ─────────────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function escAttr(s) { return esc(s); }
function fmt(d) { return d ? new Date(d).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—'; }
function badge(val) { const safe = (val||'').replace(/[^a-zA-Z0-9_-]/g,'_'); return `<span class="badge badge-${safe}">${esc(val || '—')}</span>`; }
function dollars(cents) { return cents != null ? '$' + (cents / 100).toFixed(2) : '—'; }
function truncate(s, n) { if (!s) return '—'; const t = s.length > n ? s.slice(0, n) + '...' : s; return esc(t); }
function profileName(id) { const p = cache.profiles.find(p => p.id === id); return p ? esc(p.full_name || p.email || id.slice(0,8)) : id ? esc(id.slice(0,8)) : '—'; }

// ─── Overview ────────────────────────────────
function renderOverview() {
  const totalUsers = cache.profiles.length;
  const movers = cache.profiles.filter(p => p.role === 'mover' || p.role === 'both').length;
  const customers = cache.profiles.filter(p => p.role === 'customer').length;
  const liveGigs = cache.gigs.filter(g => !g.deleted_at);
  const totalGigs = liveGigs.length;
  const posted = liveGigs.filter(g => g.status === 'posted').length;
  const completed = liveGigs.filter(g => g.status === 'completed').length;
  const totalApps = cache.applications.length;
  const totalPhotos = cache.photos.length;
  const revenue = liveGigs.filter(g => g.status === 'completed').reduce((s, g) => s + (g.final_price_cents || g.quoted_price_cents || 0), 0);
  const stripeEarnings = cache.leads.filter(l => l.payment_status === 'paid').reduce((s, l) => s + (l.deposit_cents || l.estimated_price_cents || 0), 0);
  // Abandoned leads = started intake/wizard but didn't pay (web incomplete + app drafts).
  const abandonedWeb = cache.leads.filter(l => !l.deleted_at && l.payment_status !== 'paid' && l.status !== 'booked').length;
  const draftGigCount = cache.gigs.filter(g => g.status === 'draft').length;
  const abandonedLeads = abandonedWeb + draftGigCount;
  const paidLeads = cache.leads.filter(l => l.payment_status === 'paid').length;

  const recentGigs = cache.gigs.slice(0, 5);

  return `

// ─── Workers ─────────────────────────────────
function workerCard(m) {
  const profile = cache.profiles.find(p => p.id === m.id) || {};
  const initials = (profile.full_name || '??').split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
  const skills = (m.skills || []).map(s => `<span class="skill-tag">${esc(s.replace(/-/g,' '))}</span>`).join('');
  const selfieHtml = m.selfie_url
    ? `<img class="selfie-thumb" src="${escAttr(m.selfie_url)}" onclick="window.open(this.src,'_blank')" title="Selfie verification photo">`
    : '<span style="font-size:11px;color:var(--ink4)">No selfie</span>';
  const avatarHtml = profile.avatar_url
    ? `<img class="worker-avatar" src="${escAttr(profile.avatar_url)}" alt="${escAttr(profile.full_name)}">`
    : `<div class="worker-avatar-placeholder">${esc(initials)}</div>`;

  return `
    <div class="worker-card" onclick="showWorkerModal('${m.id}')" style="animation:cardIn 0.36s cubic-bezier(0.16,1,0.3,1) both">
      <div class="worker-card-header">
        ${avatarHtml}
        <div style="flex:1;min-width:0">
          <div class="worker-name">${esc(profile.full_name) || '—'}</div>
          <div class="worker-meta">${m.account_type === 'business' ? '🏢 ' + esc(m.business_name || 'Business') : '👤 Independent'} · ${badge(m.status)}</div>
        </div>
        ${selfieHtml}
      </div>
      <div class="worker-info-row"><span class="worker-info-label">Phone</span><span>${esc(profile.phone) || '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Email</span><span>${esc(profile.email) || '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Address</span><span>${esc(m.address) || '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Vehicle</span><span>${esc(m.vehicle_make_model || m.vehicle_type) || '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Experience</span><span>${m.years_experience != null ? m.years_experience + ' yr' + (m.years_experience !== 1 ? 's' : '') : '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Service ZIPs</span><span>${esc((m.service_area_zip || []).join(', ')) || '—'}</span></div>
      <div class="worker-info-row"><span class="worker-info-label">Rating</span><span>${profile.rating ? '⭐ ' + profile.rating + ' (' + (profile.total_gigs || 0) + ' jobs)' : 'No reviews yet'}</span></div>
      ${skills ? `<div class="worker-info-row"><span class="worker-info-label">Skills</span><span>${skills}</span></div>` : ''}
      ${m.bio ? `<div style="margin-top:10px;font-size:12px;color:var(--ink3);line-height:1.6;border-top:1px solid var(--line);padding-top:10px">${truncate(m.bio, 120)}</div>` : ''}
    </div>
  `;
}

let moverTab = 'active';
function renderMovers() {
  const all = cache.moverProfiles || [];
  const active = all.filter(m => !m.deleted_at);
  const deleted = all.filter(m => m.deleted_at);
  const pending = active.filter(m => m.status === 'pending').length;
  const list = moverTab === 'deleted' ? deleted : active;
  const tabStyle = t => `padding:5px 12px;border-radius:7px;border:1px solid var(--line2);font-size:13px;font-weight:600;cursor:pointer;${moverTab===t?'background:var(--accent);color:#fff;border-color:var(--accent)':'background:var(--surface);color:var(--ink2)'}`;
  return `
    <h2 class="page-title">Workers</h2>
    <p class="page-sub">${active.length} workers · ${pending} pending approval</p>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button style="${tabStyle('active')}" onclick="moverTab='active';showPage('movers')">Active (${active.length})</button>
      <button style="${tabStyle('deleted')}" onclick="moverTab='deleted';showPage('movers')">Deleted (${deleted.length})</button>
      <button class="btn-sm" onclick="showAddMoverModal()">+ Add worker</button>
      <button class="btn-sm refresh-btn" onclick="loadAll().then(()=>showPage('movers'))">Refresh</button>

      : `<div class="empty">${moverTab==='deleted' ? 'No deleted workers' : 'No workers yet'}</div>`}
  `;
}

// ─── Businesses (employer orgs with workers + fleet) ──────────────
const VEHICLE_TYPES = ['Pickup truck','Cargo van','Sprinter / high-roof van','Box truck','Trailer','SUV','Other'];
const VEHICLE_MAKES = {
  'Ford': ['F-150','F-250','F-350','Ranger','Transit','Transit Connect','E-350'],
  'RAM': ['1500','2500','3500','ProMaster','ProMaster City'],
  'Chevrolet': ['Silverado 1500','Silverado 2500HD','Colorado','Express 2500','Express 3500'],
  'GMC': ['Sierra 1500','Sierra 2500HD','Savana'],
  'Toyota': ['Tacoma','Tundra'],
  'Nissan': ['Frontier','Titan','NV200','NV2500','NV3500'],
  'Mercedes-Benz': ['Sprinter','Metris'],
  'Isuzu': ['NPR','NPR-HD','NQR'],
  'Hino': ['155','195','268'],
  'Freightliner': ['M2 106'],
  'U-Haul (rental)': ["10' truck","15' truck","17' truck","20' truck","26' truck","Cargo van","Pickup"],
  'Penske (rental)': ["12' truck","16' truck","22' truck","26' truck","Cargo van"],
  'Budget (rental)': ["12' truck","16' truck","26' truck","Cargo van"],
  'Other': [],
};

  return `

function businessCard(b) {
  const workers = (cache.moverProfiles || []).filter(m => m.business_id === b.id);

function fillFleetModels() {
  const make = document.getElementById('fleet-make');
  const list = document.getElementById('fleet-model-list');
  const other = document.getElementById('fleet-make-other');
  if (!make || !list) return;
  const models = VEHICLE_MAKES[make.value] || [];
  list.innerHTML = models.map(m => `<option value="${escAttr(m)}">`).join('');
  if (other) other.style.display = (make.value === 'Other') ? 'inline-block' : 'none';
}

function showCreateBusiness() {
  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="position:relative">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h2>Create business</h2>
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
          <input id="biz-name" placeholder="Business name *" style="padding:9px 11px;border-radius:8px;border:1px solid var(--line)">
          <input id="biz-email" placeholder="Contact email" style="padding:9px 11px;border-radius:8px;border:1px solid var(--line)">
          <input id="biz-phone" placeholder="Contact phone" style="padding:9px 11px;border-radius:8px;border:1px solid var(--line)">
          <textarea id="biz-notes" placeholder="Notes (optional)" rows="2" style="padding:9px 11px;border-radius:8px;border:1px solid var(--line);font-family:inherit"></textarea>
          <button class="btn-sm" onclick="createBusiness()" style="align-self:flex-start">Create</button>
        </div>
      </div>
    </div>`;
}

async function createBusiness() {
  const name = (document.getElementById('biz-name').value || '').trim();
  if (!name) { alert('Business name is required.'); return; }
  const { data, error } = await sb.from('businesses').insert({
    name,
    contact_email: (document.getElementById('biz-email').value || '').trim() || null,
    contact_phone: (document.getElementById('biz-phone').value || '').trim() || null,
    notes: (document.getElementById('biz-notes').value || '').trim() || null,
  }).select('id').single();
  if (error) { alert('Error creating business: ' + error.message); return; }
  await loadAll();
  showBusinessModal(data.id);
}

function showBusinessModal(id) {
  const b = (cache.businesses || []).find(x => x.id === id);
  if (!b) return;
  const nameOf = (mid) => { const p = cache.profiles.find(x => x.id === mid); return (p && p.full_name) || '—'; };
  const workers = (cache.moverProfiles || []).filter(m => m.business_id === id);
  const fleet = (cache.fleetVehicles || []).filter(v => v.business_id === id);
  const available = (cache.moverProfiles || []).filter(m => !m.business_id);

  const rosterHtml = workers.length ? workers.map(m => `
    <div class="modal-row" style="align-items:center;gap:8px">
      <div class="modal-value" style="flex:1">${esc(nameOf(m.id))} <span style="color:var(--ink3);font-size:12px">· ${esc(m.vehicle_make_model || m.vehicle_type || 'no vehicle')}</span></div>
      <button class="btn-sm" onclick="removeWorkerFromBusiness('${id}','${m.id}')">Remove</button>
    </div>`).join('') : '<div style="color:var(--ink3);font-size:13px;padding:4px 0">No workers assigned yet.</div>';

  const addWorkerHtml = available.length ? `
    <div style="display:flex;gap:6px;margin-top:8px">
      <select id="add-worker-select" style="flex:1;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">
        ${available.map(m => `<option value="${m.id}">${esc(nameOf(m.id))}</option>`).join('')}
      </select>
      <button class="btn-sm" onclick="assignWorkerToBusiness('${id}')">Add worker</button>
    </div>` : '<div style="color:var(--ink3);font-size:12px;margin-top:6px">No unassigned workers available.</div>';

  const driverOptions = (mid) => `<option value=""${!mid ? ' selected' : ''}>Unassigned</option>` +
    workers.map(m => `<option value="${m.id}"${mid === m.id ? ' selected' : ''}>${esc(nameOf(m.id))}</option>`).join('');

  const fleetHtml = fleet.length ? fleet.map(v => `
    <div class="modal-row" style="align-items:center;gap:8px">
      <div class="modal-value" style="flex:1">${esc([v.year, v.make, v.model].filter(Boolean).join(' ')) || 'Vehicle'}${v.vehicle_type ? ` <span style="color:var(--ink3);font-size:12px">· ${esc(v.vehicle_type)}</span>` : ''}${v.license_plate ? ` <span style="color:var(--ink3);font-size:12px">· ${esc(v.license_plate)}</span>` : ''}</div>
      <select onchange="assignVehicleToWorker('${v.id}', this.value, '${id}')" title="Assign driver" style="padding:5px 8px;border-radius:6px;border:1px solid var(--line);font-size:12px">${driverOptions(v.assigned_mover_id)}</select>
      <button class="btn-sm" onclick="removeFleetVehicle('${v.id}','${id}')">✕</button>
    </div>`).join('') : '<div style="color:var(--ink3);font-size:13px;padding:4px 0">No vehicles in the fleet yet.</div>';

  const firstMakeModels = VEHICLE_MAKES[Object.keys(VEHICLE_MAKES)[0]] || [];

  document.getElementById('modal-container').innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()" style="position:relative">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <h2>🏢 ${esc(b.name)}</h2>
        <div class="modal-row"><div class="modal-label">Contact email</div><div class="modal-value">${esc(b.contact_email) || '—'}</div></div>
        <div class="modal-row"><div class="modal-label">Contact phone</div><div class="modal-value">${esc(b.contact_phone) || '—'}</div></div>
        ${b.notes ? `<div class="modal-row"><div class="modal-label">Notes</div><div class="modal-value">${esc(b.notes)}</div></div>` : ''}

        <h3 style="margin:18px 0 6px;font-size:15px;color:var(--ink)">Workers (${workers.length})</h3>
        ${rosterHtml}
        ${addWorkerHtml}

        <h3 style="margin:22px 0 6px;font-size:15px;color:var(--ink)">Fleet (${fleet.length})</h3>
        ${fleetHtml}
        <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
          <div style="font-size:12px;font-weight:600;color:var(--ink3);margin-bottom:6px">Add a vehicle</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">
            <select id="fleet-type" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">${VEHICLE_TYPES.map(t => `<option>${t}</option>`).join('')}</select>
            <select id="fleet-make" onchange="fillFleetModels()" style="padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">${Object.keys(VEHICLE_MAKES).map(mk => `<option>${mk}</option>`).join('')}</select>
            <input id="fleet-make-other" placeholder="Make" style="display:none;width:110px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">
            <input id="fleet-model" list="fleet-model-list" placeholder="Model" style="width:130px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">
            <datalist id="fleet-model-list">${firstMakeModels.map(m => `<option value="${escAttr(m)}">`).join('')}</datalist>
            <input id="fleet-year" type="number" placeholder="Year" style="width:74px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">
            <input id="fleet-plate" placeholder="Plate" style="width:92px;padding:6px 8px;border-radius:6px;border:1px solid var(--line);font-size:13px">
            <button class="btn-sm" onclick="addFleetVehicle('${id}')">+ Add</button>
          </div>
        </div>

        <div style="margin-top:22px">
          <button class="btn-sm" onclick="deleteBusiness('${id}')" style="background:var(--error-soft);color:var(--error);border-color:var(--error)">Delete business</button>
        </div>
      </div>
    </div>`;
}

async function assignWorkerToBusiness(businessId) {
  const sel = document.getElementById('add-worker-select');
  if (!sel || !sel.value) return;
  const { error } = await sb.from('mover_profiles').update({ business_id: businessId }).eq('id', sel.value);
  if (error) { alert('Error assigning worker: ' + error.message); return; }
  await loadAll();
  showBusinessModal(businessId);
}

async function removeWorkerFromBusiness(businessId, moverId) {
  const { error } = await sb.from('mover_profiles').update({ business_id: null }).eq('id', moverId);
  if (error) { alert('Error removing worker: ' + error.message); return; }
  await loadAll();
  showBusinessModal(businessId);
}

async function addFleetVehicle(businessId) {
  const makeSel = document.getElementById('fleet-make');
  const make = makeSel.value === 'Other' ? (document.getElementById('fleet-make-other').value || '').trim() : makeSel.value;
  const model = (document.getElementById('fleet-model').value || '').trim();
  const yearRaw = (document.getElementById('fleet-year').value || '').trim();
  const plate = (document.getElementById('fleet-plate').value || '').trim();
  if (!make && !model) { alert('Enter at least a make or model.'); return; }
  const { error } = await sb.from('fleet_vehicles').insert({
    business_id: businessId,
    vehicle_type: document.getElementById('fleet-type').value || null,
    make: make || null, model: model || null,
    year: yearRaw ? parseInt(yearRaw, 10) : null,
    license_plate: plate || null,
  });
  if (error) { alert('Error adding vehicle: ' + error.message); return; }
  await loadAll();
  showBusinessModal(businessId);
}

async function removeFleetVehicle(vehicleId, businessId) {
  if (!confirm('Remove this vehicle from the fleet?')) return;
  const { error } = await sb.from('fleet_vehicles').delete().eq('id', vehicleId);
  if (error) { alert('Error removing vehicle: ' + error.message); return; }
  await loadAll();
  showBusinessModal(businessId);
}

async function assignVehicleToWorker(vehicleId, moverId, businessId) {
  const { error } = await sb.from('fleet_vehicles').update({ assigned_mover_id: moverId || null }).eq('id', vehicleId);
  if (error) { alert('Error assigning driver: ' + error.message); return; }
  await loadAll();
  showBusinessModal(businessId);
}

async function deleteBusiness(id) {
  if (!confirm('Delete this business? Its fleet vehicles are removed and its workers become unassigned.')) return;
  const { error } = await sb.from('businesses').delete().eq('id', id);
  if (error) { alert('Error deleting business: ' + error.message); return; }
  closeModal();
  await loadAll();
  showPage('businesses');
}

        ${m.business_name ? `<div class="modal-row"><div class="modal-label">Business name</div><div class="modal-value">${esc(m.business_name)}</div></div>` : ''}
        <div class="modal-row"><div class="modal-label">Status</div><div class="modal-value">${badge(m.status)}</div></div>

        <div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap">

  `;
}

async function approveWorker(id) {
  const { error } = await sb.from('mover_profiles').update({ status: 'approved' }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await loadAll();
  closeModal();
  showPage('movers');
}

// Soft-delete a worker: hide them from the Workers + Crew lists but keep all
// gig/review history (gigs.mover_id is a RESTRICT FK). Reversible via Restore.
// Uses UPDATE — the "Admin can update mover profiles" policy already allows it.
async function deleteMover(id) {
  if (!confirm('Delete this worker? They will be hidden from the Workers and Crew lists. You can restore them from the Deleted tab.')) return;
  const { error } = await sb.from('mover_profiles').update({ deleted_at: new Date().toISOString() }).eq('id', id);
  if (error) { alert('Could not delete: ' + error.message); return; }
  closeModal();
  await loadAll();
  showPage('movers');
}

async function restoreMover(id) {
  const { error } = await sb.from('mover_profiles').update({ deleted_at: null }).eq('id', id);
  if (error) { alert('Could not restore: ' + error.message); return; }
  closeModal();
  await loadAll();
  showPage('movers');
}

async function suspendWorker(id) {
  if (!confirm('Suspend this worker?')) return;
  const { error } = await sb.from('mover_profiles').update({ status: 'suspended' }).eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await loadAll();
  closeModal();
  showPage('movers');
}

// ─── Calendar ────────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

function renderCalendar() {
  const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Build calendar grid
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  // Calendar shows real gigs only (paid leads are converted to gigs). Exclude
  // in-progress wizard drafts so they never appear on the schedule.
  const calGigs = cache.gigs.filter(g => g.status !== 'draft' && !g.deleted_at);
  const scheduledGigs = calGigs.filter(g => g.scheduled_for);
  const asapGigs = calGigs.filter(g => !g.scheduled_for);
  const gigsByDate = {};
  scheduledGigs.forEach(g => {
    const d = new Date(g.scheduled_for);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!gigsByDate[key]) gigsByDate[key] = [];
    gigsByDate[key].push(g);
  });
  // Also group by created_at for ASAP gigs
  asapGigs.forEach(g => {
    const d = new Date(g.created_at);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (!gigsByDate[key]) gigsByDate[key] = [];
    gigsByDate[key].push({ ...g, _isAsap: true });
  });

  // Add blocked slots to the calendar
  const blockedByDate = {};
  (cache.blockedSlots || []).forEach(bs => {
    const key = bs.blocked_date;
    if (!blockedByDate[key]) blockedByDate[key] = [];
    blockedByDate[key].push(bs);
    if (!gigsByDate[key]) gigsByDate[key] = [];
    gigsByDate[key].push({ ...bs, _isBlocked: true });
  });

  // Leads are NOT shown on the calendar — only paid gigs appear here. Leads
  // are abandoned/incomplete intake attempts and live in the Leads tab only.

  // Sort gigs within each date by time
  Object.values(gigsByDate).forEach(arr => arr.sort((a, b) => {
    const timeOf = x => new Date(x.scheduled_for || x.created_at).getHours() * 60 + new Date(x.scheduled_for || x.created_at).getMinutes();
    return timeOf(a) - timeOf(b);
  }));

  // Build cells
  let cells = '';

  // Previous month fill
  for (let i = firstDay - 1; i >= 0; i--) {
    const day = daysInPrev - i;
    cells += `<div class="cal-cell other-month"><div class="cal-date">${day}</div></div>`;
  }

  // Current month
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const dayGigs = gigsByDate[dateStr] || [];
    const maxShow = 3;

    let gigsHtml = '';
    dayGigs.slice(0, maxShow).forEach(g => {
      if (g._isBlocked) {
        gigsHtml += `<div class="cal-gig blocked" title="${g.reason || 'Blocked'}">${g.blocked_time} BLOCKED <span class="block-x" onclick="event.stopPropagation();unblockSlot('${g.id}')">&times;</span></div>`;
      } else {
        const cls = g._isAsap ? 'asap-gig' : `status-${g.status}`;
        const time = g.scheduled_for ? new Date(g.scheduled_for).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : 'ASAP';
        const label = `${time} ${truncate(g.from_address, 15)}`;
        gigsHtml += `<div class="cal-gig ${cls}" onclick="showGigModal('${g.id}')" title="${escAttr(g.from_address)} → ${escAttr(g.to_address)}\n${dollars(g.quoted_price_cents)} | ${escAttr(g.status)}">${label}</div>`;
      }
    });
    if (dayGigs.length > maxShow) {
      gigsHtml += `<div class="cal-more">+${dayGigs.length - maxShow} more</div>`;
    }

    cells += `<div class="cal-cell${isToday ? ' today' : ''}"><div class="cal-date">${d}</div>${gigsHtml}</div>`;
  }

  // Next month fill
  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let i = 1; i <= remaining; i++) {
    cells += `<div class="cal-cell other-month"><div class="cal-date">${i}</div></div>`;
  }

  // Upcoming gigs list (sorted chronologically)
  const upcoming = [...cache.gigs]
    .filter(g => g.status !== 'cancelled' && g.status !== 'completed' && g.status !== 'draft' && !g.deleted_at)
    .sort((a, b) => {
      const ta = new Date(a.scheduled_for || a.created_at).getTime();
      const tb = new Date(b.scheduled_for || b.created_at).getTime();
      return ta - tb;
    })
    .slice(0, 10);

  return `
    <h2 class="page-title">Calendar</h2>
    <p class="page-sub">Paid gigs laid out by date. Leads (incomplete intake attempts) are not shown here — see the Leads tab.</p>
    <button class="btn-sm refresh-btn" onclick="loadAll().then(()=>showPage('calendar'))">Refresh</button>

    <div class="cal-header">
      <button onclick="calPrev()">&larr;</button>
      <div class="cal-month">${monthNames[calMonth]} ${calYear}</div>
      <button onclick="calNext()">&rarr;</button>
      <button class="btn-sm" onclick="calToday()">Today</button>
    </div>

    <div class="cal-grid">
      ${dayNames.map(d => `<div class="cal-day-label">${d}</div>`).join('')}
      ${cells}
    </div>

    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--accent)"></div> Posted</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#4A7FA0"></div> Matched / In Progress</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--success)"></div> Completed</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--error)"></div> Cancelled</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:var(--warning)"></div> ASAP</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#7E57C2"></div> Lead (intake form)</div>
      <div class="cal-legend-item"><div class="cal-legend-dot" style="background:#E53935"></div> Blocked (manual)</div>
    </div>

    <h3 style="margin-top:24px">Block a Time Slot</h3>
    <div class="block-form">
      <label>Date<input type="date" id="block-date" min="${new Date().toISOString().split('T')[0]}" /></label>
      <label>Time
        <select id="block-time">
          <option value="9:00 AM">9:00 AM</option>
          <option value="10:00 AM">10:00 AM</option>
          <option value="11:00 AM">11:00 AM</option>
          <option value="12:00 PM">12:00 PM</option>
          <option value="1:00 PM">1:00 PM</option>
          <option value="2:00 PM">2:00 PM</option>
          <option value="3:00 PM">3:00 PM</option>
          <option value="4:00 PM">4:00 PM</option>
          <option value="5:00 PM">5:00 PM</option>
          <option value="6:00 PM">6:00 PM</option>
        </select>
      </label>
      <label>Reason (optional)<input type="text" id="block-reason" placeholder="e.g. Personal, Full day" /></label>
      <button onclick="blockSlot()">Block</button>
      <button onclick="blockFullDay()" style="background:#B71C1C">Block Full Day</button>
    </div>

    <div class="blocked-list">
      <h3 style="margin-top:16px">Currently Blocked</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date</th><th>Time</th><th>Reason</th><th></th></tr></thead>
          <tbody>
            ${(cache.blockedSlots || []).length ? (cache.blockedSlots || []).map(bs => `
              <tr>
                <td>${bs.blocked_date}</td>
                <td>${bs.blocked_time}</td>
                <td>${bs.reason || '—'}</td>
                <td><button class="btn-sm" style="background:#C62828;color:#fff;border:none" onclick="unblockSlot('${bs.id}')">Remove</button></td>
              </tr>
            `).join('') : '<tr><td colspan="4" class="empty">No blocked slots</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>

    <div class="cal-asap-section">
      <h3>Upcoming Gigs (chronological)</h3>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Date/Time</th><th>Type</th><th>From</th><th>To</th><th>Customer</th><th>Status</th><th>Price</th></tr></thead>
          <tbody>
            ${upcoming.length ? upcoming.map(g => `
              <tr onclick="showGigModal('${g.id}')" style="cursor:pointer">
                <td>${g.scheduled_for ? fmt(g.scheduled_for) : fmt(g.created_at)}</td>
                <td>${g.scheduled_for ? '<span style="color:var(--ink3);font-size:11px">Scheduled</span>' : '<span style="color:var(--warning);font-weight:700;font-size:11px">ASAP</span>'}</td>
                <td>${truncate(g.from_address, 25)}</td>
                <td>${truncate(g.to_address, 25)}</td>
                <td>${profileName(g.customer_id)}</td>
                <td>${badge(g.status)}</td>
                <td>${dollars(g.quoted_price_cents)}</td>
              </tr>
            `).join('') : '<tr><td colspan="7" class="empty">No upcoming gigs</td></tr>'}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

async function blockSlot() {
  const date = document.getElementById('block-date').value;
  const time = document.getElementById('block-time').value;
  const reason = document.getElementById('block-reason').value.trim();
  if (!date) { alert('Please select a date.'); return; }
  const { error } = await sb.from('blocked_slots').insert({ blocked_date: date, blocked_time: time, reason: reason || null });
  if (error) { alert('Error: ' + error.message); return; }
  await loadAll();
  showPage('calendar');
}

async function blockFullDay() {
  const date = document.getElementById('block-date').value;
  const reason = document.getElementById('block-reason').value.trim() || 'Full day blocked';
  if (!date) { alert('Please select a date.'); return; }
  const times = ['9:00 AM','10:00 AM','11:00 AM','12:00 PM','1:00 PM','2:00 PM','3:00 PM','4:00 PM','5:00 PM','6:00 PM'];
  // Don't duplicate — filter out already blocked times
  const existing = (cache.blockedSlots || []).filter(bs => bs.blocked_date === date).map(bs => bs.blocked_time);
  const toBlock = times.filter(t => !existing.includes(t));
  if (!toBlock.length) { alert('All times already blocked for this date.'); return; }
  const rows = toBlock.map(t => ({ blocked_date: date, blocked_time: t, reason }));
  const { error } = await sb.from('blocked_slots').insert(rows);
  if (error) { alert('Error: ' + error.message); return; }
  await loadAll();
  showPage('calendar');
}

async function unblockSlot(id) {
  if (!confirm('Remove this blocked time?')) return;
  const { error } = await sb.from('blocked_slots').delete().eq('id', id);
  if (error) { alert('Error: ' + error.message); return; }
  await loadAll();
  showPage('calendar');
}

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } showPage('calendar'); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } showPage('calendar'); }
function calToday() { const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth(); showPage('calendar'); }

// ─── Gig Detail Modal ────────────────────────
function showGigModal(id) {
  const g = cache.gigs.find(x => x.id === id);
  if (!g) return;
  const gigPhotos = cache.photos.filter(p => p.gig_id === id);
  const gigApps = cache.applications.filter(a => a.gig_id === id);

  // Paid gigs that came from a web lead / business job carry the full customer
  // info on the linked row — show it (like the lead modal) so confirmed gigs
  // aren't missing the customer's details.
  const linkedLead = g.quote_request_id
    ? (cache.leads || []).find(x => x.id === g.quote_request_id)
    : (cache.leads || []).find(x => x.gig_id === g.id);

// ── Surcharges: extra charge billed to the customer for an inaccurate gig ─────
// Paid via an emailed Stripe Checkout link (create-surcharge edge fn). The
// stripe-webhook flips the row to 'paid' when the customer pays.
function surchargeBadge(st) {
  const map = { pending: ['#8B6914', '#FFF8E7', 'Pending'], paid: ['#1f7a4d', '#e6f6ee', 'Paid'], canceled: ['#888', '#eee', 'Canceled'] };
  const [c, bg, lbl] = map[st] || map.pending;
  return `<span style="background:${bg};color:${c};padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700">${lbl}</span>`;
}
async function renderGigSurcharges(gigId) {
  const el = document.getElementById('surcharge-list');
  if (!el) return;
  const { data, error } = await sb.from('surcharges').select('*').eq('gig_id', gigId).order('created_at', { ascending: false });
  if (error) { el.innerHTML = `<span style="color:var(--error);font-size:12px">Could not load (${esc(error.message)})</span>`; return; }
  if (!data || !data.length) { el.innerHTML = `<span style="color:var(--ink3);font-size:13px">None yet.</span>`; return; }
  el.innerHTML = data.map(s => `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
      <span><strong>${fmtMoney(s.amount_cents)}</strong>${s.reason ? ' · ' + esc(s.reason) : ''}</span>
      <span>${surchargeBadge(s.status)}</span>
    </div>`).join('');
}
async function sendSurcharge(gigId) {
  const amtEl = document.getElementById('surcharge-amount');
  const reasonEl = document.getElementById('surcharge-reason');
  const btn = document.getElementById('surcharge-send-btn');
  const dollars = parseFloat(amtEl && amtEl.value);
  if (!(dollars > 0)) { alert('Enter a dollar amount greater than 0.'); return; }
  const amount_cents = Math.round(dollars * 100);
  const reason = (reasonEl && reasonEl.value || '').trim();
  if (!confirm(`Email the customer a Stripe link to pay an extra ${fmtMoney(amount_cents)}?`)) return;
  if (btn) { btn.disabled = true; btn.textContent = 'Sending…'; }
  const { data, error } = await sb.functions.invoke('create-surcharge', { body: { gig_id: gigId, amount_cents, reason } });
  if (btn) { btn.disabled = false; btn.textContent = 'Send pay link'; }
  const errMsg = error ? (data && data.error) || error.message || String(error) : (data && data.error);
  if (errMsg) { alert('Could not send surcharge: ' + errMsg); return; }
  alert('Pay link emailed to the customer.' + (data && data.url ? '\n\nLink: ' + data.url : ''));
  if (amtEl) amtEl.value = '';
  if (reasonEl) reasonEl.value = '';
  renderGigSurcharges(gigId);
}
